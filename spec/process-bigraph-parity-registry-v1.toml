schema_version = "1.0.0"
registry_id = "process-bigraph-parity-v1"
registry_status = "accepted-scope-pb0-implemented-qualification-open"
registered_at = "2026-07-26"
decision = "decisions/0034-process-bigraph-runtime-platform.md"
specification = "process-bigraph-runtime-semantics.md"
audit = "../design/audits/process-bigraph-runtime-parity-and-parallel-development-audit.md"
owner_interview = "../design/audits/process-bigraph-runtime-owner-interview.md"
package_name = "ProcessBigraphs.jl"
incubation_path = "lib/ProcessBigraphs"
parity_target = "Pinned Process-Bigraph 2.0 feature and observable behavioral parity through idiomatic Julia APIs"
legacy_scope = "Vivarium 1.x compatibility is excluded"
interchange_scope = "Exact Python API and declaration interchange are optional ecosystem work, not parity authorities"
external_authority = "Development and qualification are independent; Eran Agmon and upstream maintainers are not design or release authorities"
public_release_rule = "No independent public release before every pinned-parity feature is qualified and the required whole-cell-style composite passes"

[pb0_implementation]
status = "passed_bounded_foundation"
package = "../lib/ProcessBigraphs"
local_registry = "../lib/ProcessBigraphs/parity-registry.toml"
audit = "../design/audits/process-bigraph-pb0-implementation-audit.md"
evidence = "../design/evidence/process-bigraph-pb0-evidence-v1.toml"
checker = "../scripts/process-bigraph-pb0-check.jl"
implemented_direct_rows = [
    "stable-typed-paths",
    "typed-hierarchical-store",
    "structural-schema-realization",
    "typed-input-output-ports",
    "workflow-cycle-rejection",
    "exact-integer-logical-time",
    "actual-elapsed-partial-interval",
    "same-time-common-snapshot",
    "typed-process-deltas",
    "deterministic-conflict-reconciliation",
    "atomic-event-commit",
]
remaining_claim = "No row is oracle_passing or qualified; pinned Python oracles and Phase 15 internal alpha remain open."

[status_vocabulary]
allowed = [
    "not_started",
    "specified",
    "implemented",
    "oracle_passing",
    "qualified",
    "blocked",
    "excluded",
    "not_applicable",
]
not_started = "No accepted design or qualifying implementation evidence."
specified = "Normative behavior and evidence obligations are accepted; implementation evidence is incomplete."
implemented = "An implementation exists, but its required pinned oracles and production evidence are incomplete."
oracle_passing = "Required direct and pinned-oracle fixtures pass; remaining production qualification is incomplete."
qualified = "Specification, implementation, oracle, failure, persistence, documentation, and applicable backend evidence all pass."
blocked = "A recorded external or architectural blocker prevents qualification."
excluded = "Explicitly outside this registry's scope."
not_applicable = "The evidence dimension does not apply and the reason is recorded."

[classification_vocabulary]
allowed = [
    "normative_parity",
    "normative_julia",
    "compatibility_mode",
    "application_required",
    "optional_ecosystem",
    "excluded_legacy",
    "deferred_rewrite",
]
normative_parity = "Required feature and observable behavior of the pinned Process-Bigraph 2.0 baseline."
normative_julia = "Versioned Julia behavior selected independently where upstream sources disagree or leave behavior unsafe or ambiguous."
compatibility_mode = "Explicit non-normative mode reproducing a materially useful pinned upstream behavior."
application_required = "Required by the accepted whole-cell or Potts platform program but not necessarily by pinned runtime parity."
optional_ecosystem = "Useful integration that cannot block core semantic parity."
excluded_legacy = "Vivarium 1.x-only behavior outside scope."
deferred_rewrite = "Structural behavior not promoted until dedicated semantics and fixtures pass."

[evidence_vocabulary]
replay_classes = ["exact", "numerical", "statistical", "unsupported"]
oracle_kinds = ["direct", "pinned_python", "differential_local", "application", "hardware", "fuzz", "failure_injection"]
backend_statuses = ["not_started", "specified", "implemented", "qualified", "unsupported", "not_applicable"]
behavior_classifications = ["documented", "tested", "incidental", "upstream_discrepancy", "intentional_julia_improvement"]

[qualification]
required_dimensions = [
    "normative specification",
    "implementation",
    "direct semantic tests",
    "registered pinned oracle when applicable",
    "failure atomicity disposition",
    "persistence and continuation disposition",
    "RNG and replay disposition",
    "CPU reference evidence",
    "applicable process-family backend matrix",
    "documentation",
    "provenance record",
]
required_evidence_metadata = [
    "runtime_commit",
    "source_pins",
    "model_fingerprint",
    "compatibility_mode",
    "executor",
    "backend",
    "hardware",
    "replay_class",
    "artifact",
]
default_cpu_status = "not_started"
default_gpu_status = "not_applicable until the feature or process family declares a named device capability"
default_replay_status = "unsupported until explicitly qualified"

[checker]
minimum_source_count = 6
minimum_feature_count = 40
minimum_oracle_count = 12
unique_keys = ["sources.id", "features.id", "oracles.id"]
required_feature_fields = [
    "id",
    "classification",
    "status",
    "evidence_status",
    "required_for_pinned_parity",
    "required_for_first_public_release",
    "spec_sections",
    "oracle_ids",
]
required_oracle_fields = ["id", "kind", "status", "required", "feature_ids", "acceptance"]
allowed_status_source = "status_vocabulary.allowed"
allowed_classification_source = "classification_vocabulary.allowed"
release_required_status = "qualified"
pin_format = "Full lowercase 40-character git commit for git sources; immutable arXiv identifier for the paper"
invariants = [
    "Every feature id and oracle id is unique.",
    "Every feature classification and status belongs to its declared vocabulary.",
    "Every referenced oracle id and source id exists.",
    "Every normative_parity or normative_julia feature has at least one oracle.",
    "Every required_for_pinned_parity feature is also required_for_first_public_release.",
    "No excluded_legacy, optional_ecosystem, compatibility_mode, or deferred_rewrite feature is required_for_pinned_parity.",
    "A feature cannot be qualified while a required referenced oracle is below qualified.",
    "A feature cannot be qualified without documentation, persistence, failure, and backend dispositions.",
    "The registry cannot be release-ready while any required_for_first_public_release feature is below qualified.",
    "Advancing a parity source pin requires a registry version change and refreshed affected oracles.",
    "Vivarium Core cannot be cited as a parity authority.",
    "Executor completion order, worker count, and device lane cannot be semantic ordering or RNG identities.",
]

[release_gates]
internal_alpha = [
    "serial static composite",
    "typed paths and hierarchical schemas",
    "ports and topology validation",
    "exact time and imminent-event batches",
    "typed deltas and atomic commit",
    "settled-boundary checkpoint",
]
internal_beta = [
    "dynamic add/remove/divide/move/rewire",
    "Potts adapter differential qualification",
    "dynamic hierarchy failure and replay evidence",
    "applicable alternate-executor equivalence",
]
first_public_release = [
    "all required_for_pinned_parity features qualified",
    "all required_for_first_public_release features qualified",
    "Julia biochemical/FBA whole-cell-style composite qualified",
    "complete user, adapter-author, executor-author, and conformance documentation",
    "no Vivarium 1.x, exact Python interchange, or upstream endorsement claim",
]

[scheduler_policy]
normative_mode = "imminent_event"
compatibility_modes = ["pinned_deferred_sample_hold"]
time_representation = "normalized integer ticks with declared rational scale"
same_time_visibility = "one common immutable pre-commit snapshot"
partial_interval = "actual elapsed duration or declared rejection before mutation"
process_step_boundary = "Process is positive-time deadline work; Step is zero-time ordered/reactive DAG work"
cycle_policy = "reject undeclared cycles; iteration requires an explicit versioned iterative construct"

[executor_policy]
semantic_oracle = "SerialExecutor"
allowed_qualified_executors = ["SerialExecutor", "ThreadsExecutor", "DaggerExecutor"]
dagger_boundary = "Receives already selected coarse runnable batches and returns typed effects; never owns time, reconciliation, commit, topology, or observation."
coarse_units = ["process_tick", "solver_call", "field_advance", "partition_batch"]
distributed_failure = "deterministic fail-stop plus settled-checkpoint recovery; retry only declared pure idempotent work"

[gpu_policy]
runtime = "GPU-native, residency-aware, and capability-declared"
universal_gpu_requirement = false
hidden_transfer = "fail_preflight"
transfer_requirements = ["declared", "bounded", "measured", "visible", "fingerprinted"]
core_qualification = "CPU plus applicable named-device microfixtures"
process_family_rule = "Every process family publishes its own backend and replay matrix"
potts_non_regression = "Existing CPU/Metal/ROCm Potts requirements remain until separately revised"

