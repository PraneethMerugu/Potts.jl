[status_vocabulary]
allowed = [
    "not_started",
    "specified",
    "implemented",
    "oracle_passing",
    "qualified",
    "blocked",
    "excluded",
    "not_applicable",
]
not_started = "No accepted design or qualifying implementation evidence."
specified = "Normative behavior and evidence obligations are accepted; implementation evidence is incomplete."
implemented = "An implementation exists, but its required independent source-derived oracles and production evidence are incomplete."
oracle_passing = "Required direct and independent source-derived oracle fixtures pass; remaining production qualification is incomplete."
qualified = "Specification, implementation, oracle, failure, persistence, documentation, and applicable backend evidence all pass."
blocked = "A recorded external or architectural blocker prevents qualification."
excluded = "Explicitly outside this registry's scope."
not_applicable = "The evidence dimension does not apply and the reason is recorded."

[classification_vocabulary]
allowed = [
    "normative_parity",
    "normative_julia",
    "compatibility_mode",
    "application_required",
    "optional_ecosystem",
    "excluded_legacy",
    "deferred_rewrite",
]
normative_parity = "Required feature and observable behavior of the pinned Process-Bigraph 2.0 baseline."
normative_julia = "Versioned Julia behavior selected independently where upstream sources disagree or leave behavior unsafe or ambiguous."
compatibility_mode = "Explicit non-normative mode reproducing a materially useful pinned upstream behavior."
application_required = "Required by the accepted whole-cell or Potts platform program but not necessarily by pinned runtime parity."
optional_ecosystem = "Useful integration that cannot block core semantic parity."
excluded_legacy = "Vivarium 1.x-only behavior outside scope."
deferred_rewrite = "Structural behavior not promoted until dedicated semantics and fixtures pass."

[evidence_vocabulary]
replay_classes = ["exact", "numerical", "statistical", "unsupported"]
oracle_kinds = ["direct", "independent_julia", "source_derived", "metamorphic", "differential_local", "application", "hardware", "fuzz", "failure_injection"]
backend_statuses = ["not_started", "specified", "implemented", "qualified", "unsupported", "not_applicable"]
behavior_classifications = ["documented", "tested", "incidental", "upstream_discrepancy", "intentional_julia_improvement"]

[qualification]
required_dimensions = [
    "normative specification",
    "implementation",
    "direct semantic tests",
    "registered independent source-derived Julia oracle when applicable",
    "failure atomicity disposition",
    "persistence and continuation disposition",
    "RNG and replay disposition",
    "CPU reference evidence",
    "applicable process-family backend matrix",
    "documentation",
    "provenance record",
]
required_evidence_metadata = [
    "runtime_commit",
    "source_pins",
    "model_fingerprint",
    "compatibility_mode",
    "executor",
    "backend",
    "hardware",
    "replay_class",
    "artifact",
]
default_cpu_status = "not_started"
default_gpu_status = "not_applicable until the feature or process family declares a named device capability"
default_replay_status = "unsupported until explicitly qualified"

[checker]
minimum_source_count = 6
minimum_feature_count = 40
minimum_oracle_count = 12
unique_keys = ["sources.id", "features.id", "oracles.id"]
required_feature_fields = [
    "id",
    "classification",
    "status",
    "evidence_status",
    "required_for_pinned_parity",
    "required_for_first_public_release",
    "spec_sections",
    "oracle_ids",
]
required_oracle_fields = ["id", "kind", "status", "required", "feature_ids", "acceptance"]
allowed_status_source = "status_vocabulary.allowed"
allowed_classification_source = "classification_vocabulary.allowed"
release_required_status = "qualified"
pin_format = "Full lowercase 40-character git commit for git sources; immutable arXiv identifier for the paper"
invariants = [
    "Every feature id and oracle id is unique.",
    "Every feature classification and status belongs to its declared vocabulary.",
    "Every referenced oracle id and source id exists.",
    "Every normative_parity or normative_julia feature has at least one oracle.",
    "Every required_for_pinned_parity feature is also required_for_first_public_release.",
    "No excluded_legacy, optional_ecosystem, compatibility_mode, or deferred_rewrite feature is required_for_pinned_parity.",
    "A feature cannot be qualified while a required referenced oracle is below qualified.",
    "A feature cannot be qualified without documentation, persistence, failure, and backend dispositions.",
    "The registry cannot be release-ready while any required_for_first_public_release feature is below qualified.",
    "Advancing a parity source pin requires a registry version change, renewed source audit, and refreshed affected oracles.",
    "Vivarium Core cannot be cited as a parity authority.",
    "No CI, test, example, attestation, or release command installs or executes an upstream Python runtime.",
    "ACSet row identity and traversal order are nonsemantic.",
    "Executor completion order, worker count, and device lane cannot be semantic ordering or RNG identities.",
]

