    "typed deltas and atomic commit",
    "settled-boundary checkpoint",
]
internal_beta = [
    "dynamic add/remove/divide/move/rewire",
    "AlgebraicRewriting-backed atomic structural transactions",
    "Potts adapter differential qualification",
    "dynamic hierarchy failure and replay evidence",
    "applicable alternate-executor equivalence",
]
first_public_release = [
    "all required_for_pinned_parity features qualified",
    "all required_for_first_public_release features qualified",
    "Julia biochemical/FBA whole-cell-style composite qualified",
    "complete user, adapter-author, executor-author, and conformance documentation",
    "no Vivarium 1.x, exact Python interchange, live upstream-runtime-equivalence, or upstream endorsement claim",
]

[scheduler_policy]
normative_mode = "imminent_event"
compatibility_modes = ["pinned_deferred_sample_hold"]
time_representation = "normalized integer ticks with declared rational scale"
same_time_visibility = "one common immutable pre-commit snapshot"
partial_interval = "actual elapsed duration or declared rejection before mutation"
process_step_boundary = "Process is positive-time deadline work; Step is zero-time ordered/reactive DAG work"
cycle_policy = "reject undeclared cycles; iteration requires an explicit versioned iterative construct"

[executor_policy]
equivalence_reference = "SerialExecutor"
specification_oracle = "independent checked Julia oracle outside the production executor"
allowed_qualified_executors = ["SerialExecutor", "ThreadsExecutor", "DaggerExecutor"]
dagger_boundary = "Receives already selected coarse runnable batches and returns typed effects; never owns time, reconciliation, commit, topology, or observation."
coarse_units = ["process_tick", "solver_call", "field_advance", "partition_batch"]
distributed_failure = "deterministic fail-stop plus settled-checkpoint recovery; retry only declared pure idempotent work"

[gpu_policy]
runtime = "GPU-native, residency-aware, and capability-declared"
universal_gpu_requirement = false
hidden_transfer = "fail_preflight"
transfer_requirements = ["declared", "bounded", "measured", "visible", "fingerprinted"]
core_qualification = "CPU plus applicable named-device microfixtures"
process_family_rule = "Every process family publishes its own backend and replay matrix"
potts_non_regression = "Existing CPU/Metal/ROCm Potts requirements remain until separately revised"

[algebraicjulia_policy]
phase15_direct_dependencies = ["ACSets.jl", "Catlab.jl"]
phase16_direct_dependency = "AlgebraicRewriting.jl"
phase17_weak_dependency = "AlgebraicDynamics.jl"
canonical_structure = "one versioned integrated ProcessBigraph ACSet"
open_boundary = "same-schema fragment exposing role-annotated typed stores through structure-preserving maps"
open_composition = "pure n-ary structured cospans over explicit roots, mounts, junctions, exports, and initialization overrides"
derived_view = "read-only directed wiring diagrams; only the lossless annotated ProcessBigraph profile is compilable"
namespace = "mounted instances retain child namespaces; only explicit exports enter the parent boundary"
initialization = "resolved once at the composed root; conflicting defaults require an explicit parent override"
static_dynamic_boundary = "Phase 15 owns arbitrary-depth immutable hierarchy; Phase 16 owns transactions that publish new structural epochs"
semantic_identity = "stable ProcessBigraph identities and canonical paths"
row_identity = "nonsemantic"
runtime_plan = "immutable indexed tables plus exact structural provenance"
hot_path = "no ACSet traversal, matching, mutation, or structure-induced allocation"
runtime_authority = "ProcessBigraphs exclusively owns time, scheduling, state, reconciliation, commit, failure, RNG, observation, checkpoint, and replay"
checkpoint = "ProcessBigraphs-owned versioned envelope; raw ACSet serialization is interchange only"

[conformance_policy]
upstream_runtime_execution = "forbidden"
upstream_source_role = "exact pinned source and traceability authority"
claim_language = "source-audited feature and semantic parity"
specification_oracle = "small checked Julia implementation structurally independent from the production executor"
required_methods = ["source-located golden derivations", "exhaustive finite truth tables", "property tests", "metamorphic tests", "invariance tests", "failure injection", "checkpoint/restart"]
forbidden_runtimes = ["Vivarium", "Process-Bigraph Python", "Bigraph-Schema Python"]

