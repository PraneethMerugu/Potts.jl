[parallel_migration]
potts_workstream = "Preserve locked G3-B sequential CPU evidence, continue G4 field-model CPU/Metal/ROCm qualification, then published-model evidence; assembled Wang GPU qualification is retired by Decision 0035."
runtime_workstream = "Build domain-neutral paths, schemas, ports, deltas, exact time, serial execution, steps, persistence, failure, and structural transactions."
bridge_workstream = "Adapt CorePotts slice-by-slice and compare old/new serial paths before cutover."
field_freeze_rule = "The generic field adapter is co-designed but cannot freeze before the field-model evidence closes."
non_regression = ["frozen Phase 13 artifacts", "attested G3-B behavior", "existing checkpoint readers"]
single_authority = "No model may have simultaneous old and new state, scheduler, lifecycle, or persistence authorities."

[presentation_policy]
development = "independent"
eran_timing = "near_release"
eran_role = "presentation audience and optional feedback source, not semantic or release authority"
repository_split = "consider only after first complete parity release"
