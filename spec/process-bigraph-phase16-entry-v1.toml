phase16c_checker = "../scripts/process-bigraph-phase16c-check.jl"
phase16c_candidate_evidence = "../design/evidence/process-bigraph-phase16c-candidate-evidence-v1.toml"
phase16d_audit = "../design/audits/process-bigraph-phase16d-structural-transaction-audit.md"
phase16d_checker = "../scripts/process-bigraph-phase16d-check.jl"
phase16d_evidence = "../design/evidence/process-bigraph-phase16d-evidence-v1.toml"
phase16e_audit = "../design/audits/process-bigraph-phase16e-corepotts-cutover-audit.md"
phase16e_checker = "../scripts/process-bigraph-phase16e-check.jl"
phase16e_evidence = "../design/evidence/process-bigraph-phase16e-evidence-v1.toml"
phase16f_consolidation_research = "../design/audits/process-bigraph-phase16f-solver-integration-consolidation-research.md"
phase16f_consolidation_checker = "../scripts/process-bigraph-phase16f-consolidation-spec-check.jl"
phase16f_audit = "../design/audits/process-bigraph-phase16f-solver-plurality-audit.md"
phase16f_checker = "../scripts/process-bigraph-phase16f-check.jl"
phase16f_evidence = "../design/evidence/process-bigraph-phase16f-evidence-v1.toml"
roadmap = "../design/refactor-roadmap.md"

[principle]
runtime = "ProcessBigraphs owns when and why computation occurs."
engine = "Optimized solver and CPM kernels own how authorized heavy computation occurs."
one_authority = true
publication = "stage-complete-validate-authorize-publish-or-abort"

[prerequisites]
phase13_frozen = true
phase14_g3b_attested = true
process_bigraphs_phase15c_internal_alpha = true
g4_external_prerequisite = false
g4_disposition = "absorbed as mandatory Phase 16.C"

[scope]
required = [
    "solver-neutral-engine-protocol",
    "cartesian-field-descriptor-and-realization",
    "sampling-deposition-exchange-and-splitting",
    "native-field-cpu-metal-rocm",
    "algebraic-rewriting-dynamic-hierarchy",
    "typed-corepotts-structural-requests",
    "corepotts-strangler-adapter-and-first-cutover",
    "phase16-logical-checkpoint-and-legacy-conversion",
    "cpu-sciml-field-adapter",
    "cpu-independent-custom-field-adapter",
    "runnable-source-bounded-merks-2006",
    "runnable-source-bounded-cnv-scenario38-sim902",
    "failure-observation-restart-and-provenance",
]
excluded = [
    "public-release",
    "complete-pinned-parity",
    "dagger-or-distributed-qualification",
    "multi-gpu",
    "cuda-qualification",
    "universal-solver-gpu-support",
    "moving-mesh-fem-amr",
    "merge-engulf-burst-general-rewrite",
    "implicit-spo-cascade",
    "arbitrary-mid-event-restart",
    "full-merks-publication-analysis",
    "full-cnv-publication-analysis",
    "full-source-ensemble-reproduction",
    "mandatory-source-faithful-assembled-model-gpu",
    "broad-ode-dae-biochemical-fba-sbml-ecosystem",
    "algebraicdynamics",
    "whole-cell-qualification",
]

[dependency_policy]
phase16_direct = ["AlgebraicRewriting.jl"]
phase16_extension_or_adapter = ["SciMLBase.jl", "CommonSolve.jl"]
algebraic_rewriting_compat = "0.5"
scimlbase_compat = "3"
commonsolve_compat = "0.2.11"
sciml_extension = "ProcessBigraphsSciMLExt"
core_hard_sciml_dependency = false
process_bigraphs_depends_on_corepotts = false
corepotts_depends_on_process_bigraphs = true
actual_compat_bounds_required_in_16a = true
upstream_python_runtime_execution = "forbidden"

[ordering]
strict_join = true
subgates = [
    "16.A-entry-contract-dependencies-api-and-checkers",
    "16.B-engine-and-field-protocol",
    "16.C-absorbed-g4-native-field-qualification",
    "16.D-algebraic-rewriting-dynamic-hierarchy",
    "16.E-corepotts-adapter-checkpoint-and-first-cutover",
    "16.F-sciml-custom-and-cross-adapter-qualification",
    "16.G-runnable-merks-2006",
    "16.H-runnable-cnv-scenario38",
    "16.I-reconciliation-and-internal-beta-attestation",
]
parallel_after = "16.B"
parallel_branches = ["16.C", "16.D"]
compensation_allowed = false
phase16f_internal_order = ["16.F0-consolidation-repair", "P16-F01", "P16-F02", "P16-F03"]
models_wait_for_qualified_phase16f = true

[engine_protocol]
operation_families = ["interval_advance", "boundary_solve", "discrete_batch", "typed_extension"]
input_visibility = "immutable versioned projections"
target_behavior = "exact target or typed early return"
candidate = "opaque staged leaf candidate plus typed small effects"
completion = "asynchronous handle allowed"
engine_owns = ["algorithm", "internal steps", "workspace", "cache", "arrays", "layout", "device buffers", "kernels", "streams", "preconditioners"]
runtime_owns = ["logical time", "invocation reason", "identity", "schema", "version", "visibility", "RNG coordinates", "validation", "authorization", "publication", "failure", "checkpoint", "replay"]

[solver_integration]
phase16f_prototype_status = "replaced_by_qualified_real_solver_implementation"
prototype_commit = "7217f9b67db3bc0e798bab192e81ad3a8923b912"
qualified_implementation_commit = "9f9daf19e34c5430361cb98c8002f025a74d217a"
process_bigraph_owned_sciml_solve = "forbidden"
qualified_algorithm_selection = "explicit_real_algorithm_object"
automatic_algorithm_selection = "experimental"
solver_options = "bounded typed or canonical and fingerprinted"
exact_target = "solver-supported exact-target operation plus reached-time verification"
success = "standard SciML return-code and integrator-error interfaces"
generic_continuation = "reconstruct_each_invocation_from_published_canonical_state"
generic_replay = "numerical"
retained_integrator = "separately qualified codec/clone and invalidation envelope only"
published_state_mutation_during_solve = "forbidden"
custom_adapter_location = "external-style conformance fixture outside ProcessBigraphs core"
custom_adapter_independence = "no SciML dependency and no shared numerical stepping helper"
cross_adapter_oracle = "analytic/manufactured plus refinement/convergence and declared tolerances"
mermaid_role = "research reference only; not dependency, scheduler, authority, or oracle"
admitted_exports = "smallest qualified declaration-authoring surface"

[fields]
dimensions = [2, 3]
geometry = "Cartesian"
native_placement = "cell_centered"
boundary_conditions = ["periodic", "Dirichlet", "Neumann", "declared_mixed"]
required_operations = ["evolution", "sampling", "deposition", "exchange", "uptake", "accounting"]
splitting_authority = "ProcessBigraphs"
internal_splitting_authority = "engine within one invisible invocation"
undeclared_algebraic_loops = "reject"

[structure]
canonical_orchestration = "ProcessBigraph ACSet"
optimized_domain_topology = "CorePotts leaf representation"
stable_operations = ["add", "remove", "binary_divide", "move", "rewire"]
default_rewrite_semantics = "DPO-safe"
raw_rewrite_api = "experimental"
implicit_spo_cascade = false
atomic_with_numeric_candidate = true

[backends]
native_required = ["CPU", "Metal", "ROCm"]
real_hardware_required = ["Metal", "ROCm"]
sciml_required = ["CPU"]
custom_adapter_required = ["CPU"]
cuda = "deferred"
hidden_transfer = "forbidden"
hidden_host_fallback = "forbidden"
portable_device_precision = "Float32"
cpu_reference_precision = "Float64 separate profile"

[models]
merks = "runnable source-bounded Merks et al. 2006 elongation/autocrine model"
cnv = "runnable source-bounded Shirinifard et al. 2012 scenario 38 and simulation 902"
runnable_lifecycle = ["build", "preflight", "initialize", "advance", "observe", "checkpoint", "restart", "terminate"]
full_analysis_required = false
quantitative_reproduction_claim = false

[closure]
all_required_ledger_rows = "qualified"
real_hardware_required = true
exact_head_candidate_required = true
merged_tree_verification_required = true
metadata_only_attestation_required = true
clean_tree_required = true
content_addressed_evidence_required = true
publish_package = false
closure_checker_expected_now = "open"
