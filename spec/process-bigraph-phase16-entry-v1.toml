implementation_status = "phase16f_qualified_c_hardware_open"
internal_beta = false
public_release = false
current_package_version = "0.4.0"
target_package_version = "0.5.0"
julia = "1.12.6"

[authority]
owner_interview = "../design/audits/process-bigraph-phase16-owner-interview.md"
decision = "decisions/0039-phase-16-compute-ownership-and-scope.md"
