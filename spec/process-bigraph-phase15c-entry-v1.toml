schema_version = "1.0.0"
contract_id = "process-bigraphs-phase15c-entry-v1"
phase = "15.C"
title = "ProcessBigraphs serial internal-alpha entry and closure contract"
status = "ready_after_preimplementation_packet_merges"
runtime_implementation_status = "not_started"
internal_alpha = false
public_release = false
current_package_version = "0.3.0"
closure_package_version = "0.4.0"
julia = "1.12.6"

[authority]
owner_interview = "../design/audits/process-bigraph-phase15c-serial-alpha-owner-interview.md"
decision = "decisions/0038-process-bigraph-serial-alpha.md"
runtime_semantics = "process-bigraph-runtime-semantics.md"
parity_registry = "process-bigraph-parity-registry-v1.toml"
implementation_plan = "../design/audits/process-bigraph-phase15c-serial-alpha-plan.md"
entry_audit = "../design/audits/process-bigraph-phase15c-entry-audit.md"
roadmap = "../design/refactor-roadmap.md"

[pins]
process_bigraph_commit = "305ea826191e9f897f0c6e207bc303bbc44a9eef"
process_bigraph_version = "1.5.0"
bigraph_schema_commit = "4b208e13620e09e877af52ea07273bc9429a3a17"
bigraph_schema_version = "1.4.3"
upstream_python_runtime_execution = "forbidden"

[scope]
claim = "qualified immutable-topology serial internal alpha"
target_features = [
    "canonical-state-serialization",
    "temporal-process-protocol",
    "ordered-reactive-step-protocol",
    "explicit-iterative-constructs",
    "imminent-event-scheduler",
    "adaptive-deadlines",
    "versioned-update-algebra",
    "settled-boundary-checkpoint",
    "versioned-process-continuation",
    "semantic-lineage-rng",
    "transactional-failure",
    "readonly-observer-protocol",
    "serial-semantic-executor",
    "multirate-input-semantics",
    "independent-julia-specification-oracle",
]
supporting_oracle_features = [
    "workflow-cycle-rejection",
    "exact-integer-logical-time",
    "actual-elapsed-partial-interval",
    "same-time-common-snapshot",
    "typed-process-deltas",
    "deterministic-conflict-reconciliation",
    "atomic-event-commit",
]
retained_direct_features = [
    "canonical-process-bigraph-acset",
    "compiled-structural-epoch",
    "structured-cospan-open-composition",
    "derived-directed-wiring-view",
]
excluded_features = [
    "structural-add-remove",
    "structural-divide",
    "structural-move-rewire",
    "process-reconfiguration-retirement",
    "merge-engulf-burst-general-rewrite",
    "mid-event-restart",
    "extension-emitters",
    "declared-measured-transfers",
    "threads-executor",
    "dagger-coarse-executor",
    "sciml-ode-adapter",
    "modelingtoolkit-frontend",
    "catalyst-jumpprocesses-adapter",
    "cobrexa-jump-fba-adapter",
    "sbml-supported-feature-matrix",
    "potts-spatial-process-adapter",
    "whole-cell-style-composite",
    "algebraic-rewriting-structural-transactions",
    "algebraicdynamics-scientific-extension",
    "python-declaration-interchange",
    "vivarium1-api-compatibility",
    "ray-rest-ec2-nextflow-backends",
]

[registry_promotion]
phase15c_oracle = "oracle-independent-specification"
target_status_after_closure = "implemented or partial, according to the exact frozen limitation"
target_evidence_after_closure = "phase15c_independent_oracle_passing"
supporting_evidence_after_closure = "existing direct evidence plus phase15c independent-oracle evidence"
retained_evidence_rule = "Phase 15.A and Phase 15.B direct evidence is preserved, not relabelled."
broader_oracle_rule = "Passing the Phase 15.C oracle does not pass later dynamic-lineage, executor-equivalence, application, hardware, adapter, or whole-cell oracles attached to the same feature."
full_pinned_parity = false

[ordering]
strict = true
stages = [
    "15.C0-entry-freeze",
    "15.C1-production-serial-scheduler",
    "15.C2-semantic-rng",
    "15.C3-observation-and-continuation",
    "15.C4-failure-and-checkpoint",
    "15.C5-independent-julia-oracle",
    "15.C6-qualification-matrix",
    "15.C7-two-stage-closure",
]
join_rule = "A stage may begin only after every exit condition and non-regression gate of its predecessor passes."

[scheduler]
executor = "SerialExecutor policy over SerialRuntime state"
batch_selection = "minimum exact next deadline"
same_time_visibility = "one common immutable pre-commit snapshot"
adaptive_deadline = "validated proposal published atomically with event state"
horizon_policies = ["exact", "stop_prior"]
partial_interval = "actual elapsed duration only for declared support; otherwise preflight rejection"
reactive_steps = "declared acyclic layers repeated only on changed declared inputs until quiescence or fingerprinted bound"
iteration = "named fingerprinted region with deterministic order and hard bound or convergence rule"
empty_time_advance = "unchanged settled snapshot without process event or RNG consumption"
event_record = "canonical time, ordinal, due identities, activations, iteration outcome, and fingerprints"

[rng]
model = "versioned counter-based semantic addressing"
address = [
    "model-fingerprint",
    "normalized-root-seed",
    "process-identity",
    "logical-time",
    "event-identity",
    "lineage-identity",
    "draw-site",
    "explicit-draw-index",
]
exact_core_draws = ["bits", "integers", "uniforms"]
stateful_solver_rng = "allowed only as typed versioned checkpointed continuation with replay class"
failed_event_consumes_identity = false
observer_namespace_isolated = true

[observation]
registration = "declarative pre-execution plan"
visibility = "declared read-only projection of immutable settled candidate"
required_records = "validated and published atomically with event"
external_emitters = "non-atomic extensions with explicit idempotency and retry contracts"
model_fingerprint_unchanged = true
runtime_observation_fingerprint_required = true

[continuation]
untracked_any_alpha_qualified = false
required_contracts = [
    "stable owner identity",
    "schema identity",
    "semantic implementation version",
    "canonical encode and decode",
    "validation",
    "fingerprint",
    "restore compatibility",
    "invalidation",
]
migration = "explicit registered migration only"

[failure]
policy = "deterministic fail-stop"
implicit_retry = false
atomic_fields = [
    "candidate state",
    "clocks",
    "continuations",
    "RNG and event position",
    "observer position",
    "required records",
]
injection_stages = [
    "process invocation",
    "invocation-result validation",
    "reconciliation",
    "reactive-step execution",
    "continuation validation",
    "required observation",
    "checkpoint capture",
    "record publication",
]
diagnostic_fields = [
    "schema version",
    "semantic code",
    "stage",
    "owner",
    "logical time",
    "event identity",
    "last stable fingerprint",
    "cause classification",
    "retry classification",
]

[checkpoint]
representation = "canonical deterministic versioned logical envelope"
julia_object_serialization_authoritative = false
restore_mode = "exact compatible serial restore only"
retain_reader_versions = ["1.0.0"]
required_contents = [
    "committed state and exact logical time",
    "event ordinal and event position",
    "process and step clocks",
    "typed process, step, and observer continuations",
    "semantic RNG algorithm, address schema, root identity, and declared solver RNG state",
    "observer positions",
    "structural epoch and compiled-plan compatibility identities",
    "model, runtime, observation, continuation, and checkpoint fingerprints",
]

[oracle]
location = "lib/ProcessBigraphs/test/specification_oracle"
production_dependency = false
representation = "independent simple Julia records, tables, and loops"
shared_with_production = ["neutral machine-readable fixture inputs", "neutral result schemas"]
forbidden_production_calls = [
    "scheduler",
    "reconciliation and update-law application",
    "semantic RNG",
    "continuation validation or codec",
    "observation",
    "checkpoint codec or restore",
    "canonical fingerprint",
    "runtime execution",
]
allowed_import_roots = ["Base", "Core", "Test", "TOML", "SHA"]
source_locations_required = true
core_comparison = "exact"
generated_cases = "bounded, seeded, reproducible, shrinkable, and retained on failure"
mutation_targets = ["scheduler", "update", "RNG", "failure", "checkpoint"]

[[fixtures]]
id = "same-time-accumulator"
purpose = "common snapshot, deterministic reconciliation, declaration and invocation-order invariance"

[[fixtures]]
id = "multirate-producer-consumer"
purpose = "imminent events, actual elapsed intervals, multirate input policies, exact horizons"

[[fixtures]]
id = "adaptive-pulse"
purpose = "transactional adaptive deadlines, invalid deadline failure, checkpoint continuation"

[[fixtures]]
id = "reactive-dag"
purpose = "changed-input activation, layer visibility, deterministic quiescence and activation bound"

[[fixtures]]
id = "iterative-region"
purpose = "bounded and convergent fixed-structure iteration plus undeclared-cycle rejection"

[[fixtures]]
id = "stochastic-branch"
purpose = "semantic draw addresses, explicit indices, order invariance, failure retry and observer isolation"

[[fixtures]]
id = "open-composite-fork-join"
purpose = "all supported authoring paths, hierarchy flattening, provenance, runtime trace equivalence"

[[fixtures]]
id = "observation-failure-restart"
purpose = "required record atomicity, typed continuation, injected failures, every-boundary restart"

[qualification]
methods = [
    "finite truth tables",
    "focused unit tests",
    "production-oracle differential tests",
    "property tests",
    "metamorphic invariance tests",
    "mutation-sensitivity tests",
    "failure injection",
    "every-settled-boundary checkpoint and restart",
]
authoring_paths = [
    "ordinary typed",
    "direct ACSet",
    "n-ary composition",
    "pairwise grouping",
    "structured cospan",
    "annotated wiring profile",
]
invariance_dimensions = [
    "declaration and ACSet order",
    "composition grouping",
    "process invocation order",
    "dictionary order",
    "RNG request order",
    "restart boundary",
    "observer selection",
    "explicit retry attempt",
]
performance_guardrails = [
    "no runtime ACSet traversal",
    "no structure-dependent hot-path allocation",
    "no hidden transfer",
    "no asymptotic regression",
]
fastest_runtime_claim = false

[evidence]
candidate_artifact = "CI-generated; not committed as final closure evidence"
candidate_required_fields = [
    "schema version",
    "runtime package and version",
    "qualified head commit and tree",
    "CI run and job identities",
    "Julia and dependency resolutions",
    "source pins",
    "model and fixture fingerprints",
    "assertion totals by method and feature",
    "mutation targets killed",
    "failure stages exercised",
    "restart cuts exercised",
    "performance guardrails",
    "limitations",
]
attestation_path = "../design/evidence/process-bigraph-phase15c-evidence-v1.toml"
attestation_required_fields = [
    "implementation merge commit and tree",
    "qualified implementation head and identical tree",
    "implementation PR and CI run",
    "candidate artifact digest",
    "exact evidence totals",
    "registry promotions",
    "retained direct evidence",
    "open limitations and exclusions",
]

[closure]
all_or_nothing = true
implementation_pr_required = true
closure_attestation_pr_required = true
required_aggregate = "Required"
merge_method = "squash"
ci_bypass_allowed = false
version_bump_in_attestation = "0.4.0"
publish_package = false
final_internal_alpha = true
final_claim = "qualified immutable-topology serial internal alpha with independent Julia-oracle evidence"

[maintenance]
focused_modules = [
    "executor and scheduler",
    "semantic RNG",
    "observation",
    "continuation",
    "checkpoint codec",
    "specification oracle",
]
broad_rewrite_allowed = false
behavior_preserving_decomposition_allowed = true
composition_debt = "Split validation, mounting, initializer resolution, ACSet assembly, and provenance only behind preserved Phase 15.B tests."

[entry_files]
required = [
    "design/audits/process-bigraph-phase15c-serial-alpha-owner-interview.md",
    "spec/decisions/0038-process-bigraph-serial-alpha.md",
    "design/audits/process-bigraph-phase15c-serial-alpha-plan.md",
    "spec/process-bigraph-phase15c-entry-v1.toml",
    "design/audits/process-bigraph-phase15c-entry-audit.md",
    "scripts/process-bigraph-phase15c-entry-check.jl",
]

[entry_ci]
workflow = ".github/workflows/ci.yml"
step = "Enforce ProcessBigraphs Phase 15.C pre-implementation entry"
phase15c_runtime_tests_present = false
phase15c_oracle_lane_present = false
explanation = "The entry checker is required now. Runtime and oracle lanes are added by the implementation PR and may not be claimed by the pre-implementation packet."
