schema_version = "1.0.0"
trace_id = "process-bigraph-phase16-merks-trace-v1"
model_id = "merks-2006-vasculogenesis"
claim = "runnable source-bounded reimplementation"
quantitative_reproduction = false
primary_authority = "Merks et al., Developmental Biology 289(1), 44-54 (2006)"
doi = "10.1016/j.ydbio.2005.10.003"
paper_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC2562951/"
implementation_contract = "merks-vasculogenesis-reference-assembly-v1"

[authority]
order = [
    "primary paper equations, methods text, and figure captions",
    "original source implementation if later recovered",
    "author clarification",
    "later implementations as non-authoritative cross-checks",
]
original_source_available = false
source_closure = "closed-with-named-ambiguity-profiles"

[scope]
included = [
    "canonical startup",
    "contact",
    "area",
    "inertia_length",
    "paper_local_connectivity",
    "cell_site_secretion",
    "ECM_only_decay",
    "diffusion",
    "extension_chemotaxis",
    "native_field_adapter",
    "arbitrary_qualified_field_adapter",
    "independent_external_style_field_adapter",
    "bounded_trajectory",
    "read_only_shape_connectivity_observation",
    "checkpoint_restart",
    "failure_rollback",
]
excluded = [
    "Figure_5_full_ensemble",
    "publication_morphometry_pipeline",
    "lacuna_and_branch_point_quantitative_reproduction",
    "original_random_seed_reproduction",
    "original_code_equivalence",
]

[compute_ownership]
scheduler = "ProcessBigraphs SerialRuntime"
field_timing = "one scheduled ProcessBigraphs process every 2 seconds"
cpm_timing = "one reactive CorePotts MCS after every fifteenth committed field publication"
field_computation = "selected EngineDeclaration adapter"
cpm_computation = "CorePotts SequentialCPM kernel"
publication = "ProcessBigraphs reconciliation at one settled event boundary"
forbidden_second_authorities = [
    "model-owned time loop",
    "adapter-owned scheduler",
    "ProcessBigraphs-owned numerical solver algorithm",
    "legacy CorePotts MCSPlan as assembly scheduler",
]

[reference_split]
profile = "field_then_cpm_v1"
source_status = "paper fixes 15 field steps per MCS but does not fix CPM/field ordering"
sequence = [
    "advance field from tick k to k+1 using frozen forcing and ECM mask",
    "publish field",
    "on tick multiples of 15 publish the MCS field snapshot",
    "run and publish one CPM MCS",
    "recompute cell-site forcing and ECM-only decay mask from published labels",
]
sensitivity_requirement = "alternative split orders remain future sensitivity profiles, not equivalent source claims"

[reference_ambiguity_profile]
profile = "bounded_reference_v1"
volume_strength = 50.0
source_length_strength = 5.0
field_boundary = "periodic_minimize_boundary_effects"
connectivity_penalty = "hard_rejection"
placement = "deterministic_seeded_nonoverlap"
seed = 2006
source_status = "none of these exact choices is fixed by the primary paper"
claim = "explicit runnable profile only"

[[source_facts]]
id = "geometry"
locator = "Results, Figure 4 caption"
value = "500x500 lattice; 2 micrometers per site; cells initially in central 333x333 region"
implementation = "merks2006_initial_labels"
mapping = "exact"

[[source_facts]]
id = "population"
locator = "Results, Figure 4 caption"
value = "282 endothelial cells"
implementation = "merks2006_initial_labels"
mapping = "exact count; placement algorithm profiled"

[[source_facts]]
id = "copy_process"
locator = "Methods P19-P21, Equations 1-3"
value = "eight-neighbor copy relation; N attempts/MCS; T=50; gamma=1000"
implementation = "Merks2006CPMStep and CorePotts SequentialCPM"
mapping = "exact schedule; derived chemotaxis coefficient"

[[source_facts]]
id = "contact"
locator = "Methods P21"
value = "Jcc=40, JcM=20, JcB=100 with frozen border pixels"
implementation = "UnorderedContactHamiltonian and FixedExterior(MediumOwner(2))"
mapping = "exact values"

[[source_facts]]
id = "area"
locator = "Equation 1 and Figure 8 caption"
value = "standard target area inferred as 400 square micrometers = 100 lattice sites"
implementation = "QuadraticVolumeHamiltonian target_volume=100"
mapping = "derived; strength is an ambiguity-profile value"

[[source_facts]]
id = "length"
locator = "Equations 4-5 and Results P25"
value = "target length approximately 100 micrometers = 50 lattice sites; l=4*sqrt(lambda_max(I)/area)"
implementation = "QuadraticElongationHamiltonian"
mapping = "CorePotts target=12.5 and strength=16*source_length_strength"

[[source_facts]]
id = "local_connectivity"
locator = "Methods P23, Equation 7, Figure 3"
value = "cyclic eight-neighbor collision test with exactly-two-cell exception and E0>2000 penalty"
implementation = "MerksLocalConnectivityConstraint"
mapping = "source test exact; prohibitive penalty profiled as hard rejection"

[[source_facts]]
id = "field_equation"
locator = "Equation 6 and Methods P24"
value = "cell-site secretion; ECM-only decay; diffusion; 15 steps/MCS; dt=2s; dx=2 micrometers"
implementation = "ManagedFieldAdvanceProcess plus forcing and decay_weights projections"
mapping = "exact terms and cadence; boundary and split are named profiles"

[[source_facts]]
id = "field_parameters"
locator = "Methods P24"
value = "D=1e-13 m^2/s; alpha=epsilon=1.8e-4/s"
implementation = "D=0.1 micrometer^2/s; secretion=decay=1.8e-4/s"
mapping = "exact unit conversion"

[[source_facts]]
id = "physical_time"
locator = "Results P25"
value = "1 MCS = 30 seconds"
implementation = "15 ProcessBigraph ticks at 2 seconds per tick"
mapping = "exact"

[[derived_mappings]]
id = "chemotaxis"
source = "DeltaH=gamma*(c_donor-c_recipient), Metropolis temperature T"
target = "CorePotts nonconservative log bias coefficient*(c_recipient-c_donor)"
formula = "coefficient=gamma/T=1000/50=20"

[[derived_mappings]]
id = "inertia_length"
source = "source length=4*major_axis_rms"
target = "CorePotts energy=lambda_core*(major_axis_rms-target_core)^2"
formula = "target_core=target_source/4; lambda_core=16*lambda_source"

[[qualification_targets]]
