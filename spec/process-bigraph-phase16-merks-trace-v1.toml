    "native bounded trajectory",
    "real SciML bounded trajectory",
    "independent external-style adapter bounded trajectory",
    "state and positivity invariants",
    "MCS-cadenced cell-count, occupancy, connectivity, and field observations",
    "settled checkpoint/restart",
