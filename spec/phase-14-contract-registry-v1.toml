schema_version = "1.0.0"
registry_version = "phase14-contract-registry-v1"
status = "phase14.0-frozen-historical-contract-set; superseded by phase14-contract-registry-v2"
registered_at = "2026-07-24"
superseded_by = "phase-14-contract-registry-v2.toml"
superseding_decision = "decisions/0031-phase-14-single-semantic-kernel.md"
gpu_promotion_superseded_by = "decisions/0032-phase-14-gpu-native-promotion.md"
umbrella_spec = "phase-14-coupled-dynamics-api.md"
source_records = "../design/audits/phase-14-model-source-records-v1.toml"
source_closure_records = "../design/audits/phase-14-source-closure-v1.toml"
capability_matrix = "../design/audits/phase-14-model-capability-matrix-v1.toml"
morpheus_compatibility_matrix = "../design/audits/phase-14-morpheus-continuous-semantics-v1.toml"
d9_work_items = "../design/audits/phase-14-d9-work-items-v1.toml"
freeze_assessment = "decisions/0030-phase-14-coupled-dynamics-and-freeze-impact.md"
default_implementation_status = "specified-only"
default_backend_status = "historical-not-claimed; stable promotion is governed by Decision 0032 and registry v2"
freeze_rule = "An uncoupled Phase 13 model retains its existing API, fingerprint, checkpoint, result, RNG, and algorithm identities."

[coverage]
existing_or_paper_specific_capability_ids = [
    "core-contact-volume-surface",
    "elongation-equivalence",
    "paper-initialization",
]
coverage_rule = "Every additive or stable-extension capability not listed here must appear in at least one contract capability_ids entry."

[statuses]
provisional = "candidate semantics requiring source closure, prototypes, conformance fixtures, and owner acceptance"
accepted = "owner-approved normative contract; implementation maturity remains separately reported"

[backend_statuses]
reference_required = "ordinary sequential CPU reference is required before the contract can become production implemented"
not_claimed = "the contract makes no support claim for this backend"
unsupported = "preflight must reject the contract/backend combination"
qualified = "the named contract version has applicable real-hardware evidence"

