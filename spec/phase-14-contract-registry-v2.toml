schema_version = "2.1.0"
registry_version = "phase14-contract-registry-v2"
status = "phase14.1-owner-approved-simplified generic-hierarchical GPU-native contract set; Wortel CPU/Metal/ROCm passed; Wang order accepted and implementation current; individual contracts provisional"
registered_at = "2026-07-25"
supersedes = "phase-14-contract-registry-v1.toml"
architecture_decision = "decisions/0031-phase-14-single-semantic-kernel.md"
gpu_promotion_decision = "decisions/0032-phase-14-gpu-native-promotion.md"
generic_authoring_decision = "decisions/0033-phase-14-generic-hierarchical-authoring.md"
gpu_implementation_plan = "../design/audits/phase-14-gpu-native-implementation-plan.md"
kernel_specification = "phase-14-semantic-kernel.md"
source_records = "../design/audits/phase-14-model-source-records-v1.toml"
source_closure_records = "../design/audits/phase-14-source-closure-v1.toml"
capability_matrix = "../design/audits/phase-14-model-capability-matrix-v1.toml"
morpheus_compatibility_matrix = "../design/audits/phase-14-morpheus-continuous-semantics-v1.toml"
d9_work_items = "../design/audits/phase-14-d9-work-items-v1.toml"
freeze_assessment = "decisions/0030-phase-14-coupled-dynamics-and-freeze-impact.md"
freeze_rule = "An uncoupled Phase 13 model retains its existing API, normalization, fingerprint, checkpoint, result, RNG, algorithm, and qualification identities."
authority_rule = "Every authoring route lowers completely to one canonical semantic model before execution. No facade, adapter, report, or storage envelope is a second model authority."
stable_boundary = "completed MCS after required observation"

[coverage]
existing_or_paper_specific_capability_ids = [
    "core-contact-volume-surface",
    "elongation-equivalence",
    "paper-initialization",
]
derived_tooling_capability_ids = ["continuous-model-adapters"]
coverage_rule = "Every remaining capability must appear in at least one kernel contract capability_ids entry. Adapter capabilities are derived tooling over the kernel and must not create another runtime."

[statuses]
provisional = "owner-approved architecture whose observable contract still requires its registered vertical-slice implementation and conformance gate"
accepted = "normative contract with completed source, implementation, continuation, conformance, and owner gates"
experimental = "extension point outside stable Phase 14 compatibility until a source-backed promotion gate passes"

[backend_statuses]
reference_required = "ordinary sequential CPU reference is required before the contract can become production implemented"
qualification_required = "a backend-resident implementation and applicable real-hardware evidence are required before stable promotion"
not_claimed = "the contract makes no support claim for this backend"
unsupported = "preflight must reject the contract/backend combination before mutation"
qualified = "the named contract version has applicable real-hardware evidence"

[gpu_native_policy]
stable_targets = ["CPU", "Metal", "ROCm"]
deferred_targets = ["CUDA"]
portable_floating_precision = "Float32"
paper_fidelity_precision = "CPU Float64 is a separate evidence profile and does not replace Metal or ROCm qualification"
residency_rule = "Simulation state, fields, graphs, queues, histories, and accumulators remain device-resident; scalar host loops, hidden fallback, per-MCS transfer, and steady-state allocation fail qualification."
allowed_host_boundaries = ["pre-launch authoring and complete lowering", "explicit observation", "checkpoint", "user snapshot", "analysis"]
promotion_rule = "Every stable or release Phase 14 execution capability requires sequential CPU reference evidence and real-hardware Metal and ROCm qualification for the exact contract/law/storage/algorithm combination."

[canonical_model]
areas = ["state", "process", "plan", "lifecycle", "observation", "spatial-roles", "potts-algorithm-identities"]
derived_projections = ["fingerprint", "continuation", "checkpoint-envelope", "backend-preflight", "inspection", "compatibility-report"]
single_authorities = ["global-time", "mcs-duration", "schedule-order", "read-write-sets", "snapshots", "semantic-identity"]

[authoring_facades]
rule = "A facade may add biological vocabulary and documented defaults, but must lower completely to the canonical model and may not own separate execution, persistence, clocks, or identity."
candidate_values = [
    "SiteProperty",
    "CellHistory",
    "FieldDynamics",
    "FieldExchange",
    "RelationshipSet",
    "RelationshipDynamics",
    "SiteDynamics",
    "ContinuousSystem",
    "StagedProtocol",
    "ContinuousEvent",
    "DelayState",
    "PhaseObservation",
]

[authoring_composition]
root_model = "PottsModel retains flat order-independent declarations for small models and Phase 13 compatibility."
hierarchy = "ModelFragment is the sole generic hierarchical composition unit; no CoupledModel, paper-specific core model, or independent domain runtime is admitted."
requirements = "Fragment requirements are named and typed by semantic category, owner, schema, units, lifecycle obligations, capabilities, and backend needs as applicable."
exports = "Fragment exports are named immutable references to admitted declarations or operations; private fragment declarations are inaccessible externally."
plan = "Exactly one normalized root plan references exported operations and owns all order, cadence, stages, snapshots, lifecycle commit, observations, and stable boundaries."
lowering = "Bindings, nested fragments, export paths, and convenience entries resolve completely to the canonical seven-area model before execution."
identity = "Equivalent explicit-leaf and fragment-packaged models have the same scientific fingerprint; composition paths remain diagnostic provenance."
paper_boundary = "Selected paper or author names are forbidden as stable CorePotts/PottsToolkit exports; example-layer builders use only the generic API and do not count as generic conformance evidence."
backend_boundary = "Backend requirements propagate transitively from the lowered fragment graph; no fragment may hide fallback, transfer, synchronization, allocation, or unsupported laws."
acceptance_fixtures = ["nested binding and privacy", "named requirement/export mismatch truth tables", "direct-versus-fragment fingerprint identity", "fragment substitution", "one-root-plan expansion", "Wang", "CNV", "Morpheus", "CPU/Metal/ROCm preflight and qualification"]

[adapter_boundary]
stable_core_dependency = "none"
optional_authoring_targets = ["ModelingToolkit"]
future_optional_targets = ["SBML", "MorpheusML"]
explicit_non_scope = ["Mermaid.jl"]
report_levels = ["exact-semantic", "qualified-numerical", "explicit-approximation", "partial", "rejected"]

[experimental_scope]
families = [
    "adaptive-integration",
    "solver-located-root-events",
    "differential-algebraic-equations",
    "stochastic-differential-equations",
    "deterministic-reaction-systems",
    "discrete-jump-processes",
    "hybrid-reactions",
]
promotion_rule = "A family requires a selected source or mandatory compatibility fixture, exact observable semantics, continuation and failure behavior, a CPU reference, backend-resident Metal and ROCm qualification if promoted to stable execution, conformance evidence, and owner acceptance."

[[contracts]]
id = "state"
version = "0.2.0-provisional"
family = "kernel"
semantic_status = "provisional"
implementation_status = "wortel-cpu-reference-proven"
specification = "phase-14-semantic-kernel.md"
public_values = ["StateSpec", "StateOwner", "GlobalOwner", "CellOwner", "SiteOwner", "FieldOwner", "MembraneOwner", "RelationshipOwner", "CurrentStorage", "HistoryStorage"]
source_models = ["wortel-2021-act-cpm", "merks-2006-vasculogenesis", "shirinifard-2012-cnv", "wang-2025-collective-tumor-migration"]
compatibility_targets = ["morpheus-continuous-semantics-v1"]
capability_ids = ["accepted-copy-site-history", "cell-state-history", "dynamic-relationships", "degradable-structures", "continuous-state-domains", "continuous-events-and-delays"]
reads = ["declared owner/schema/storage/lifecycle metadata", "declared snapshot identities"]
writes = ["authoritative typed state only through registered processes and lifecycle commits"]
snapshot = "every read names a plan-provided phase, transaction, process, or completed-MCS snapshot"
persistence = "all future-relevant state, history, delay, generation, and storage-policy metadata are derived into the coupled envelope"
fingerprint = "qualified identity, owner, schema, storage, initialization, lifecycle, continuation, backend policy, and version"
cpu = "reference_required"
metal = "qualification_required"
rocm = "qualification_required"
freeze_impact = "additive; existing Phase 13 state and property meanings remain unchanged"
acceptance_requires = [
    "owner-domain and schema validation",
    "history and delay ordering fixtures",
    "creation/division/retirement/reuse fixtures",
    "derived continuation codec",
    "facade-versus-direct normalization identity",
    "device adaptation and residency fixtures",
    "Metal and ROCm restart and transfer evidence",
    "Wortel CPU then Metal/ROCm closure before Wang",
]

