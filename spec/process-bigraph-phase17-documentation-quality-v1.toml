schema_version = "1.0.0"
contract_id = "process-bigraph-phase17-documentation-quality-v1"
phase = "17"
status = "specified"
site_name = "ProcessBigraphs.jl"
support_label = "qualified unpublished internal beta"
minimum_curated_pages = 35
minimum_score = 92
minimum_category_score = 8
required_page_count = 35
required_learn_count = 10
required_example_program_count = 6
required_case_study_count = 2
required_concept_count = 9
required_api_count = 5

top_level_sections = [
    "Home",
    "Learn",
    "Examples",
    "Scientific Case Studies",
    "Concepts and Guarantees",
    "API",
]

[build]
project = "lib/ProcessBigraphs/docs/Project.toml"
manifest = "lib/ProcessBigraphs/docs/Manifest.toml"
make = "lib/ProcessBigraphs/docs/make.jl"
source_root = "lib/ProcessBigraphs/docs/src"
models_root = "lib/ProcessBigraphs/docs/models"
browser_root = "lib/ProcessBigraphs/docs/browser"
doctest = true
warnonly = false
strict_cross_references = true
curated_pages = true
dirname = "ProcessBigraphs"
tag_prefix = "ProcessBigraphs-"
development_route = "/Potts.jl/ProcessBigraphs/dev/"
pull_request_deploy = false
persistent_beta_banner = true

[visibility]
complete_program_visible = true
complete_program_executed = true
reader_include_forbidden = true
hidden_scientific_setup_forbidden = true
prebuilt_case_study_model_forbidden = true
canonical_source_drift_allowed = false
allowed_hidden_setup = [
    "rendering-backend-activation",
    "documentation-display-configuration",
]

[page_contract]
required_fields = [
    "outcome",
    "prerequisites",
    "support-level",
    "complete-executed-source",
    "material-defaults",
    "expected-result",
    "establishes",
    "does-not-establish",
    "backend-runtime-seed",
    "reproduction-command",
    "next-step",
]

[runtime_budgets_seconds]
first_tutorial_warm_max = 10
ordinary_example_warm_max = 15
wortel_case_study_warm_max = 30
merks_case_study_warm_max = 60
all_required_programs_warm_max = 240
strict_docs_build_warm_max = 480
hosted_job_timeout_max = 1800

[asset_budgets_bytes]
video_each_max = 3145728
new_generated_media_total_max = 15728640
raster_each_max = 524288

[api]
inventory = "spec/process-bigraph-phase17-api-v1.toml"
admitted_docstring_percent = 100
admitted_owning_page_percent = 100
unclassified_allowed = 0
internal_references_in_required_pages_allowed = 0

[media]
home_visual_required = true
architecture_diagram_required = true
scheduling_timeline_required = true
transaction_diagram_required = true
every_complete_example_has_result_visual = true
each_case_study_has_state_figure = true
each_case_study_has_quantitative_trace = true
each_case_study_has_animation = true
animation_static_fallback_required = true
animation_text_summary_required = true
meaningful_alt_text_required = true
decorative_explicitly_hidden = true
source_command_hash_required = true
generated_from_displayed_program = true

[rubric]
categories = [
    "information-architecture",
    "progressive-pedagogy",
    "visible-executable-source",
    "api-and-extension-reference",
    "scientific-accuracy-and-nonclaims",
    "reproducibility-and-provenance",
    "visual-explanation",
    "accessibility-and-responsive-design",
    "operations-and-maintenance",
    "browser-task-success",
]
points_each = 10
minimum_total = 92
minimum_each = 8
required_nine_or_better = [
    "visible-executable-source",
    "api-and-extension-reference",
    "scientific-accuracy-and-nonclaims",
    "accessibility-and-responsive-design",
    "browser-task-success",
]

