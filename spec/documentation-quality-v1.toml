schema_version = "1.0.0"
status = "accepted-target"
title = "Potts.jl documentation quality contract"
docs_root = "docs/src"
navigation_file = "docs/make.jl"
process_bigraph_publication_excluded = true
authorities = [
    "design/audits/documentation-9-of-10-audit.md",
    "design/audits/documentation-interview-round-1.md",
    "design/audits/documentation-interview-round-2.md",
    "design/audits/documentation-interview-round-3.md",
]
required_navigation_sections = [
    "Home",
    "Learn",
    "Examples",
    "Published Models",
    "Concepts and Guarantees",
    "API",
]

[policy]
audiences = ["beginner", "model_builder", "researcher", "extension_author", "backend_specialist"]
support_levels = ["stable", "experimental", "internal"]
page_kinds = ["home", "learn", "example_index", "example", "published_models", "concept", "api"]
page_states = ["target", "transitional", "planned_optional"]
runtime_classes = ["none", "fast", "expensive"]
provenance_classes = ["original", "concept_inspired", "adapted", "published_reproduction"]
visual_classes = ["none", "diagram", "figure", "animation"]
api_classes = ["stable_user", "stable_extension", "experimental", "internal_export", "deprecated"]
forbidden_public_capability_tags = [
    "phase16",
    "dynamic_hierarchy",
    "structural_add",
    "structural_remove",
    "structural_divide",
    "structural_move",
    "structural_rewire",
    "process_bigraph_potts_adapter",
]

[budgets]
fast_example_seconds = 15
warm_suite_seconds = 300

[quality_gate]
minimum_rubric_score = 90
required_learn_pages = 14
required_examples = 10
required_platform_smokes = ["macos", "linux", "windows"]
required_task_reviews = ["beginner", "model_builder", "extension_author"]
required_animations = [
    "differential-adhesion-example",
    "chemotaxis-example",
    "growth-division-example",
    "elongated-network",
]
stable_docstring_coverage = 1.0
public_name_classification_coverage = 1.0
strict_documenter = true
weekly_external_links = true
visible_canonical_programs = true
forbid_reader_includes = true
visual_examples_use_makiepotts = true
visual_examples_use_backend = true
forbid_custom_example_images = true

[current_evidence]
platform_smokes = ["macos", "linux", "windows"]
task_reviews = ["beginner", "model_builder", "extension_author"]

[current_evidence.rubric]
scientific_accuracy = 9
build_and_reproducibility = 10
information_architecture = 9
beginner_pedagogy = 9
visual_communication = 9
example_quality = 9
api_usability = 9
showcase_quality = 9

[current_evidence.platform_evidence]
macos = "design/evidence/consolidation-qualified/macos-install-smoke.toml"
linux = "design/evidence/consolidation-qualified/linux-install-smoke.toml"
windows = "design/evidence/consolidation-qualified/windows-install-smoke.toml"

[current_evidence.task_review_evidence]
beginner = "design/evidence/documentation/beginner-task-review.toml"
model_builder = "design/evidence/documentation/model-builder-task-review.toml"
extension_author = "design/evidence/documentation/extension-author-task-review.toml"

[api]
stability_inventory = "design/audits/phase-13-api-inventory.toml"
provisional_api_allowlist = "design/audits/phase-14-public-api-v2.toml"
makie_inventory = "design/makiepotts/public-api-v0.2.toml"
provisional_api_class = "experimental"
provisional_api_required_status = "wortel-vertical-slice-provisional"
act_class = "experimental"

[api.stability_class_map]
stable_corepotts = "stable_extension"
stable_pottstoolkit = "stable_user"
limited = "experimental"
experimental = "experimental"
internal = "internal_export"

[api.makie_class_map]
stable = "stable_user"
limited = "stable_user"
experimental = "experimental"

