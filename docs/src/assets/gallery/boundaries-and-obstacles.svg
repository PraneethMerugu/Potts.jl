<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"
      viewBox="0 0 640 360" role="img"
      aria-labelledby="title description">
      <title id="title">Boundaries and Obstacles</title>
      <desc id="description">All declared obstacle owners remain immutable</desc>
      <style>
        .title { font: 700 24px system-ui, sans-serif; fill: #17243b; }
        .subtitle { font: 14px system-ui, sans-serif; fill: #52627a; }
        .axis { stroke: #738197; stroke-width: 1.5; }
        .grid { stroke: #dce2ea; stroke-width: 1; }
        .tick { font: 12px system-ui, sans-serif; fill: #52627a; }
        .label { font: 600 13px system-ui, sans-serif; fill: #344258; }
      </style>
      <rect width="100%" height="100%" rx="16" fill="#f7f9fc"/>
      <text x="72" y="34" class="title">Boundaries and Obstacles</text>
      <text x="72" y="56" class="subtitle">All declared obstacle owners remain immutable</text>
      <line x1="72" x2="612"
y1="72.00"
y2="72.00" class="grid"/>
<line x1="72" x2="612"
y1="128.50"
y2="128.50" class="grid"/>
<line x1="72" x2="612"
y1="185.00"
y2="185.00" class="grid"/>
<line x1="72" x2="612"
y1="241.50"
y2="241.50" class="grid"/>
<line x1="72" x2="612"
y1="298.00"
y2="298.00" class="grid"/>
      <line x1="72" x2="72" y1="72" y2="298" class="axis"/>
      <line x1="72" x2="612" y1="298"
        y2="298" class="axis"/>
      <text x="60" y="303.00"
text-anchor="end" class="tick">0.0</text>
<text x="60" y="268.76"
text-anchor="end" class="tick">1.0</text>
<text x="60" y="234.52"
text-anchor="end" class="tick">2.0</text>
<text x="60" y="200.27"
text-anchor="end" class="tick">3.0</text>
<text x="60" y="166.03"
text-anchor="end" class="tick">4.0</text>
<text x="60" y="131.79"
text-anchor="end" class="tick">5.0</text>
<text x="60" y="97.55"
text-anchor="end" class="tick">6.0</text>
<text x="60" y="63.30"
text-anchor="end" class="tick">7.0</text>
      <polyline points="72.00,298.00 612.00,92.55" fill="none" stroke="#6dc8ec"
        stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

      <text x="342.0" y="340"
        text-anchor="middle" class="label">saved sample</text>
      <text x="20" y="185.0" text-anchor="middle"
        transform="rotate(-90 20 185.0)"
        class="label">verified obstacles</text>
    </svg>
