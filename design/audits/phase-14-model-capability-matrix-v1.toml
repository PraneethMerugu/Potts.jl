backend_promotion_rule = "Every stable Phase 14 execution capability requires a sequential CPU reference and backend-resident real-hardware Metal and ROCm qualification; host-only authoring and declared observation/checkpoint/analysis boundaries are not execution capabilities."

[classes]
supported = "already supported and conforming"
stable_extension = "expressible through an existing stable extension protocol"
additive = "requires an additive reusable CorePotts or PottsToolkit capability"
incompatible = "requires an incompatible frozen-contract decision"
paper_specific = "paper-specific assembly or analysis in reusable model source"

