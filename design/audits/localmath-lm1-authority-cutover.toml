  "lib/LocalWorksets/src",
  "lib/CorePotts/src",
  "lib/LocalWorksets/test",
  "lib/CorePotts/test",
  "benchmark",
]
patterns = [
  { name = "old-topology-plan-overload", regex = '''plan\s*\([^\n]*LocalWork[^\n]*topology''' },
  { name = "topology-relation-adapter", regex = '''[Tt]opology(To|2)[Rr]elation|[Rr]elation(From|2)[Tt]opology''' },
