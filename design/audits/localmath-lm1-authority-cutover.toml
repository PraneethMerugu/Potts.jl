schema_version = "1.0.0"
specification = "spec/localmath-direct-cutover.md"
baseline_ledger = "design/audits/localmath-cutover-authority-ledger.toml"
target_gate = "LM-1"
status = "implemented_review_approved"

completion_rule = "LM-1 may be marked implemented only after every row has a row-level disposition check, every required target anchor exists, every forbidden anchor is absent from its declared scope, and all evidence queries pass. Aggregate symbols, files, kernels, lines added, or lines deleted are never substitutes for these checks."
atomicity_rule = "The rows are implementation work packages, not supported migration states. The repository presented to the LM-1 gate must satisfy all rows together and expose no old/new selector, adapter, overload, alias, or fallback execution route."
authority_rule = "This file records the approved LM-1 row dispositions and machine-checkable source, compiler, and real-GPU facts. The LM-0 numerical ceilings remain frozen; the explicit LM-1 flagship amendment supersedes only the deleted 13-stage structural identity. Compiler/Julia, GPU/performance, scientific-modeling, and simplification/maintainability reviews approve the final source."

required_rows = [
  "semantic-waist",
  "plan-and-prepared-lifecycle",
  "spaces-fields-relations",
  "relation-proof-minting",
  "read-and-access-declarations",
  "control-selection",
  "parameter-schema",
  "publication-declarations",
  "field-and-relation-binding",
  "physical-storage-layout",
  "workspace-planning",
  "prepared-relation-views",
  "freshness-and-runtime-content",
  "evidence-and-inspection",
  "lowering-and-execution",
  "event-dependency-status",
  "kernel-families",
  "legacy-authoring-grammar",
  "downstream-direct-rewrite",
]

