[disposition_meanings]
in_place = "Strengthen the sole current owner directly; no peer semantic or lifecycle type may coexist."
replaced = "Delete every current semantic owner and install the listed sole target owner in the same atomic boundary."
retained = "Retain only the named domain-neutral physical or lifecycle mechanism; it may not own a deleted semantic fact."

[proof_construction_policy]
owner = "LocalWorksets planning"
construction_inventory_required = true
extensions_may_construct_proof = false
extensions_may_assert_semantic_traits = false
required_relation_families = [
  "identity",
  "fixed_degree",
  "packed",
  "affine",
  "grouped_inverse",
  "composed",
  "runtime_key",
  "subset",
  "product_index",
  "periodic_boundary",
  "exterior_boundary",
  "masked_boundary",
  "strict_interior",
  "ghost",
]

