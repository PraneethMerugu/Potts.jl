# Status meanings checked by scripts/check_localmath_cutover_authority_ledger.jl:
# baseline: every current anchor exists and every replacement anchor is absent.
# in_place: current anchors still exist under the sole old-named implementation;
#           justification and gate evidence are mandatory.
# replaced: current anchors are absent and replacement anchors exist.
# deleted: current anchors are absent; no replacement is required.
# retained: current anchors exist as permitted private residue; a domain-neutral
#           justification and gate evidence are mandatory.

