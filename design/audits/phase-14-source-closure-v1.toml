[[models]]
id = "graner-glazier-1992-sorting"
source_closure = "closed-with-registered-ambiguity"
validation_target_id = "gg1992-figure2-boundary-kinetics-v1"
validation_target = "Digitized Figure 2 homotypic, heterotypic, and aggregate-edge boundary fractions from 5 through 4000 MCS, with the paper's reported logarithmic trend as a secondary check."
baseline_policy = "Digitize the cited paper panel into a provenance-bearing derived table; retain digitization uncertainty and do not redistribute the APS panel."
claim_boundary = "Quantitative Reproduction is unavailable until the initialization and execution envelope is narrowed by source recovery, author clarification, or a registered result showing robustness across every consequential ambiguity. Until then the model remains Reimplementation in Progress."
authority_order = ["1992 paper", "author clarification", "later implementations as non-authoritative sensitivity references"]
license_disposition = "citation-only article; independently authored Potts.jl code, analyses, derived numerical tables, and generated figures may be committed; no APS figure or unavailable source code is vendored"
sensitivity_plan_id = "gg1992-source-envelope-v1"
sensitivity_axes = [
    "lattice dimensions, cell counts, target area, and rounded-mask construction varied as a coupled initialization family",
    "periodic versus no-flux boundary handling",
    "full Moore versus explicitly enumerated next-nearest proposal/contact/surface relations",
    "reported 16N attempt budget held fixed while testing alternative source-time interpretations",
    "two T=0 annealing MCS treated either as observation-only work or source-time-advancing work",
    "replicate and seed ensembles large enough to separate initialization uncertainty from trajectory noise",
]
failure_rule = "If a named Figure 2 conclusion changes sign, rank, or fitted trend across an unresolved axis, the record is inconclusive and cannot receive a reproduction label."
clarification_questions = [
    "What lattice, cell counts, target area, boundary conditions, and initialization procedure generated Figures 1 and 2?",
    "Did the two T=0 MCS advance the reported clock, and were they run before every sampled point?",
    "What seeds, replicate count, and exact boundary estimator produced Figure 2?",
]

