    "assembled-sequential-cpu",
    "portable-execution-view",
    "failure-and-overflow",
    "persistence-and-restart",
    "steady-state-allocation",
    "order-and-boundary-visibility",
]
status_rule = "The live ledger lists every canonical process exactly once. passed_facets and remaining_facets are disjoint and partition required_facets; row status is pending for zero passed facets, partial for a strict subset, and passed only for the complete set."
closure_rule = "Every process row and every facet must be passed and backed by a matching manifest process proof. Evidence for one process or isolated primitive cannot substitute for another process or for assembled visibility."

[closure_protocol]
status = "passed"
ledger = "phase-14-g3b-closure-ledger-v1.toml"
claim_checker = "../../scripts/check_phase14_g3b_closure.jl"
completion_claim = "G3-B complete"
completion_rule = "The completion claim is permitted only when every closure_requirement has status passed in the closure ledger, every referenced evidence artifact exists, every registered command exits successfully, and every registered source-semantic study is accepted with immutable source, analysis, uncertainty, and controlled-fixture artifacts."
primitive_rule = "Passing a reusable primitive or a KernelAbstractions CPU oracle may close only that named increment. It cannot close the canonical Wang assembly, a source-semantic study, G3-B, or any real GPU backend."
profile_boundary = "G3-B requires the source-faithful sequential CPU model and portable structural/device-readiness evidence over the identical canonical plan. Real Metal and ROCm numerical execution, residency, device code, transfer, memory, and performance qualification are exclusively G3-C and may not redesign G3-B semantics."
stable_boundary_rule = "Only a completed target MCS after required observations is restartable. A closure fixture must reject capture after every earlier process phase and every internal field substep."
failure_rule = "Every mutating process proves candidate-only failure behavior, deterministic failure class and canonical first failing identity where applicable, unchanged authoritative state and semantic time, and unchanged publication epoch."
allocation_rule = "After construction and warm-up, every scientific process proves zero dynamic scientific-storage allocation in its isolated sequential CPU fixture. The complete portable KernelAbstractions CPU target-MCS transition must preserve all tracked host/device scientific allocation counters, allocate at most 65536 Julia heap bytes of fixed launch/orchestration overhead, and prove that overhead does not grow with lattice, cell, edge, field, or observation-row capacity. Caller-owned observation serialization and checkpoint output buffers are measured separately and may not hide scientific-storage allocation."
evidence_rule = "Each closure artifact records the exact clean tested commit, git tree, Julia and package/runtime versions, platform, exact command, input hashes, raw-output hash, assertion totals, and claim boundary. Contract and ledger are already passed in the tested commit; the later attestation may add only the hashed closure-evidence root."

[closure_attestation]
schema_version = "1.0.0"
manifest = "design/evidence/phase-14/g3b-closure/manifest-v1.toml"
evidence_root = "design/evidence/phase-14/g3b-closure"
hash_algorithm = "sha256"
tested_commit_rule = "All registered commands execute from one clean implementation commit containing revision 7 of this contract and the closure checker. The manifest records that commit and its git tree."
attestation_commit_rule = "The manifest and hashed artifacts are committed afterward as an attestation. From tested_commit to the checker HEAD, changed paths are restricted to design/evidence/phase-14/g3b-closure/**. Contract and ledger must already be passed at tested_commit and cannot be edited by the attestation."
artifact_rule = "Every command stdout/stderr capture, source-study input, source excerpt/index, analysis, uncertainty record, controlled-fixture output, comparison report, environment manifest, matrix, and fingerprint referenced by a proof is a regular file beneath evidence_root with recorded byte length and matching SHA-256."
proof_rule = "The manifest contains one passed requirement proof for every closure requirement and one passed process proof for every canonical process. Each process proof lists the complete required-facet set plus its supporting command and artifact IDs; missing facets and dangling or duplicate IDs fail closure."
study_rule = "Each registered source-semantic study has one accepted manifest row naming the pinned Wang/CC3D/RoadRunner source identities, immutable source and analysis artifacts, an explicit uncertainty record, controlled conformance fixtures, and the tested commit. New external CC3D execution is not required."
command_rule = "Every closure_command has exactly one passed result at tested_commit with exact command text, exit code zero, positive assertion count or an explicit non-test validation count, and hashed stdout/stderr."
claim_rule = "The manifest claim is exactly 'G3-B complete'; it explicitly denies real Metal/ROCm qualification, performance qualification, Phase 14.3 classifier/paper reproduction, and bitwise CC3D std::rand replay."

