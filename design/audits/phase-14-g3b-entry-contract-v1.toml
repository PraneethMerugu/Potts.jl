schema_version = "1.2.0"
status = "accepted-implementation-entry"
accepted_at = "2026-07-25"
revised_at = "2026-07-25"
revision = 3
model_id = "wang-2025-collective-tumor-migration"
gate = "G3-B"
scope = "source-backed sequential CPU reference through backend-adaptable canonical state, processes, workspaces, and one root plan"
semantic_authority = "../../spec/phase-14-semantic-kernel.md"
gpu_authority = "../../spec/decisions/0032-phase-14-gpu-native-promotion.md"
authoring_authority = "../../spec/decisions/0033-phase-14-generic-hierarchical-authoring.md"
source_record = "phase-14-model-source-records-v1.toml"
order_authority = "phase-14-wang-order-oracle-v1.toml"
source_revision = "60ebcf013aafefdff39ebe566114ee79f2a6e54d"
source_runtime = "CompuCell3D 4.2.5"
paper_doi = "10.1016/j.bpj.2025.04.010"
implementation_rule = "No Wang-specific runtime hierarchy or public paper-specific API. Generic state and process declarations lower to one canonical model; physical storage is backend-adapted before execution."

[entry_decision]
architecture_interview_required = false
implementation_may_start = true
open_runtime_oracles_block_generic_primitives = false
open_runtime_oracles_block_complete_wang_claim = true
cpu_oracle_is_architectural_authority = false
cpu_oracle_purpose = "deterministic semantic and numerical reference for the identical canonical model later qualified on Metal and ROCm"
internal_substeps_are_stable_boundaries = false
only_completed_mcs_is_checkpointable = true
exchange_mode_must_be_plan_resolved = true
cross_domain_writes_must_publish_as_one_logical_transaction = true

[source_time_mapping]
rule = "CompuCell3D source MCS k maps to normalized target MCS k+1."
reason = "Potts.jl MCS 0 is the finalized initial condition, while CompuCell3D 4.2.5 executes a real Potts/field/Python iteration labelled MCS 0."
source_first = 0
source_last = 499
target_first = 1
target_last = 500
source_label_is_clock = false
source_label_derivation = "source_mcs = completed_target_mcs - 1"
initialization_rule = "Only the registered source start() hooks, including the one RoadRunner advance, occur before finalized Potts.jl MCS 0. No source step() Potts attempt, field substep, history sample, exchange, retune, or observation is hidden in initialization."
fingerprint_rule = "Schedules fingerprint normalized target MCS ranges; paper observations may additionally publish the exactly derived source_mcs label."

[profiles.source_faithful_cpu]
floating_precision = "mixed source-compatible: Float32 field and source-runtime-equivalent Float64 cell algebra/ODE oracle"
purpose = "foreign-runtime agreement and exact/invariant/restart conformance"
backend = "sequential CPU"
field_arithmetic = "pinned CC3D 4.2.5 DiffusionSolverFE Float32 evaluation, compared under the registered source-local tolerance"

[profiles.portable]
floating_precision = "Float32"
backends = ["CPU", "Metal", "ROCm"]
purpose = "one portable numerical profile used for cross-backend conformance and G3-C qualification"
field_arithmetic = "for each canonical (x,y): pair_x=left+right; pair_y=down+up; lap=(pair_x+pair_y)-4.0f0*center; diffused=muladd(0.2f0,lap,center); output=is_medium ? 1.0f0 : diffused. Every operation is Float32; fast-math reassociation and alternative contraction are forbidden."
same_backend_replay = "bitwise for schedule, ownership, reset values, reduction topology, and status; floating results follow the registered deterministic reduction tree"
cross_backend_comparison = "preregistered tolerance and invariant comparison, not unconditional bitwise equality"

[numerical_tolerances]
field_local_atol = 9.5367431640625e-7
field_local_rtol = 9.5367431640625e-7
uptake_local_atol = 3.814697265625e-6
uptake_local_rtol = 3.814697265625e-6
balance_rule = "absolute error <= 64*eps(Float32)*max(1, reference mass)"
exact_quantities = ["integer schedules", "periodic index mapping", "Medium overwrite value 1.0f0", "uptake cap 1.0f0 for exact branch fixtures", "cell slot/generation identity", "status and commit epoch"]
registration_rule = "Every comparison declares the reference runtime, arithmetic profile, observable, absolute/relative rule, and aggregation rule before the first paper-scale run. A changed tolerance creates a new evidence revision and invalidates no earlier raw artifact."
oracle_rule = "Foreign-runtime microfixtures are generated from controlled non-paper-scale inputs. Potts.jl does not choose tolerances by inspecting the Wang paper-scale outputs."

[capacities]
cell_capacity = "construction-time parameter, fixed before execution"
history_capacity = 5
relationship_maximum_degree = 4
relationship_capacity = "derived and preallocated from cell_capacity * maximum_degree / 2 plus explicit slack policy"
observation_capacity = "derived from cell_capacity and declared output schema"
overflow_rule = "deterministic failure status; never allocate, drop, or reorder silently"

[[state]]
id = "secretome"
owner = "field"
schema = "scalar concentration on a logical 256x256 square lattice; source provenance retains the singleton CC3D z extent 256x256x1"
logical_type = "Float32"
storage = "current"
physical_layout = "one authoritative contiguous backend-resident Matrix{Float32}; two same-shape staging grids are workspace, not state"
initialization = "zero at finalized Potts.jl MCS 0; target MCS 1/source MCS 0 performs the first five diffusion/reset substeps"
lifecycle = "lattice lifetime; no division or death policy"
persistence = ["authoritative field values", "semantic field time at completed MCS"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "fpp_polarity_force.xml DiffusionSolverFE/secretome"

[[state]]
id = "centroid_history"
owner = "cell"
schema = "two-component centroid sample"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "bounded-history"
physical_layout = "structure-of-arrays ring: x[capacity,cell], y[capacity,cell], head[cell], count[cell]"
initialization = "sample post-Potts centroid once per MCS; no read before more than five real samples exist"
lifecycle = "initialize active slot; reset on retirement or generation change; source target has no division"
persistence = ["samples", "head", "count", "cell generation"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "cell.dict x_list/y_list"

[[state]]
id = "self_polarity"
owner = "cell"
schema = "normalized two-component displacement and pre-normalization magnitude"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "structure-of-arrays x[cell], y[cell], magnitude[cell]"
initialization = "zero"
lifecycle = "zero on create; reset on retirement"
persistence = ["x", "y", "magnitude", "cell generation"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "x_self_polarity, y_self_polarity, self_polarity"

[[state]]
id = "signal"
owner = "cell"
schema = "nonnegative scalar secretome input s"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "structure-of-arrays s[cell]"
initialization = "zero"
lifecycle = "zero on create and retirement"
persistence = ["s", "cell generation"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "cell.dict['s'] and RR['s']"

[[state]]
id = "uptake_multiplier"
owner = "global"
schema = "one positive scalar calibration multiplier shared by every eligible cell"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "backend-resident one-element value plus initialized status"
initialization = "unset status plus zero value"
lifecycle = "model lifetime; no cell lifecycle policy"
persistence = ["multiplier", "initialized status"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "cell.dict['multiply']; source writes the identical global value into every cell, so normalized state stores it once"

[[state]]
id = "intracellular_state"
owner = "cell"
schema = "rac dynamic species, constant a, mapped input s, and semantic ODE time"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "structure-of-arrays rac[cell], a[cell], time[cell]"
initialization = "rac sampled uniformly on [0,30), a=1, s=0, followed by one source-equivalent 2880-time-unit advance before MCS 0"
lifecycle = "initialize with semantic RNG namespace on create; reset on retirement"
persistence = ["rac", "a", "time", "cell generation", "numerical method identity"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "Antimony RR model and OdeSteppable"

[[state]]
id = "focal_strength"
owner = "cell"
schema = "scalar focal-point spring strength"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "structure-of-arrays strength[cell]"
initialization = "zero at finalized Potts.jl MCS 0; the first retune is target MCS 1/source MCS 0 after that target's Potts and ODE positions"
lifecycle = "zero on create and retirement"
persistence = ["strength", "cell generation"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "cell.dict['fpp']"

[[state]]
id = "focal_relationships"
owner = "relationship"
schema = "undirected generation-aware cell pair with strength, target length, and maximum length"
logical_type = "integer endpoints/generations plus profile floating type payload"
storage = "registered-specialized"
physical_layout = "bounded canonical SoA: endpoint_a, generation_a, endpoint_b, generation_b, strength, target_length, maximum_length, active"
initialization = "empty; accepted-copy topology follows source FocalPointPlasticity eligibility"
lifecycle = "remove stale endpoint generation before slot reuse"
persistence = ["active edges", "canonical order", "payload", "endpoint generations", "capacity"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "FocalPointPlasticity Local plugin"

[[state]]
id = "motility_force"
owner = "cell"
schema = "two-component external-potential coefficient plus derived magnitude/coefficient/alignment fraction"
logical_type = "Float64 source profile; Float32 portable profile"
storage = "current"
physical_layout = "structure-of-arrays x[cell], y[cell], magnitude[cell], hill_coefficient[cell], alignment_fraction[cell]"
initialization = "zero"
lifecycle = "zero on create and retirement"
persistence = ["x", "y", "magnitude", "hill_coefficient", "alignment_fraction", "cell generation"]
adaptation = ["CPU", "Metal", "ROCm"]
source = "lambdaVecX/Y and output attributes"

[[workspace]]
id = "field_staging"
layout = "two same-shape Float32 grids: field substep ping-pong; exchange candidate field and per-site removal contributions"
capacity = "two times the exact 256x256 logical lattice dimensions"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[workspace]]
id = "cell_reduction"
layout = "per-cell uptake totals, active/generation validation, and fixed-tree global maximum scratch"
capacity = "cell_capacity plus a construction-time fixed reduction tree; portable Wang reduction width is 256"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[workspace]]
id = "phase_status"
layout = "backend-resident validation status, failure code, failing index, and one logical publication epoch"
capacity = "constant per coupled integrator"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[workspace]]
id = "polarity_snapshot"
layout = "SoA snapshot x[cell], y[cell] and neighbor sum/count"
capacity = "cell_capacity"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[workspace]]
id = "relationship_transactions"
layout = "bounded create/remove/retune request arrays, conflict keys, status buffer"
capacity = "derived from relationship_capacity and accepted-copy attempt policy"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[workspace]]
id = "observation_reducers"
layout = "declared per-cell record columns and bounded geometric accumulators"
capacity = "cell_capacity plus declared aggregate reducers"
steady_state_allocation = false
adaptation = ["CPU", "Metal", "ROCm"]

[[process]]
id = "potts_metropolis"
phase = 1
trigger = "normalized target MCS 1:500, corresponding to source MCS 0:499"
reads = ["ownership", "cell geometry", "motility_force", "focal_relationships"]
writes = ["ownership", "cell geometry", "contact-neighbor graph", "focal_relationships"]
snapshot = "accepted-copy transaction snapshot for topology; preceding completed-MCS snapshot for force and relationship energy"
commit = "ordered sequential Potts commit with accepted-copy relationship transaction"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "secretome_field_advance"
phase = 2
trigger = "normalized target MCS 1:500, corresponding to source MCS 0:499"
reads = ["secretome", "post-Potts ownership/type field"]
writes = ["secretome"]
snapshot = "one process-entry post-Potts ownership/type snapshot remains immutable across all five internal substeps; substep n reads the staged result of substep n-1"
commit = "one atomic synchronous process commit after all five internal substeps and validation; no internal substep is externally visible or checkpointable"
numerical_policy = "five Float32 four-neighbor x/y-periodic forward-Euler substeps on a logical 256x256 Matrix; coefficient 0.2f0 per substep; each substep computes diffusion from its input snapshot and then exactly overwrites every Medium output site with 1.0f0 before that output feeds the next substep"
failure_policy = "nonfinite input/output, shape/ownership mismatch, invalid coefficient/profile, or workspace/backend mismatch writes a deterministic status and canonical first failing index. The authoritative field is unchanged until all five staged substeps pass validation; failure advances no publication epoch."
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "centroid_sample"
phase = 3
trigger = "normalized target MCS 1:500, corresponding to source MCS 0:499"
reads = ["post-Potts cell centroid"]
writes = ["centroid_history"]
snapshot = "completed-Potts snapshot"
commit = "atomic synchronous commit"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "self_polarity_from_history"
phase = 4
trigger = "normalized target MCS 122:500, corresponding to source MCS > 120"
reads = ["centroid_history including current sample"]
writes = ["self_polarity"]
snapshot = "completed centroid_sample snapshot"
commit = "atomic synchronous commit"
numerical_policy = "normalize current centroid minus ring sample four MCS intervals earlier; zero displacement maps to zero vector"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "secretome_signal_exchange"
phase = 5
trigger = "plan-resolved mode: inactive on target 1:121/source 0:120; reset on target 122:210/source 121:209; calibrate on target 211/source 210; publish on target 212:500/source 211:499"
reads = ["secretome", "ownership", "cell volume", "uptake_multiplier"]
writes = ["secretome", "signal", "uptake_multiplier"]
snapshot = "completed field snapshot plus one post-Potts ownership, generation, and volume snapshot; the plan supplies an immutable exchange mode"
commit = "one cross-domain logical transaction publishes the candidate field, per-cell signal writes, global multiplier/status, and publication epoch only after every reduction and invariant passes"
numerical_policy = "reset mode writes s=0 without field mutation. Calibrate and publish modes remove min(1,0.0025*C) from every eligible cell-owned site in a staged candidate field; raw uptake is removed_total/post-Potts cell volume. Calibrate mode sets one global multiplier 4/max(raw uptake) without writing s. Publish mode requires initialized multiplier and writes s=raw uptake*multiplier. A zero/nonfinite calibration maximum is a structured domain failure and commits nothing."
reduction_policy = "source-faithful CPU accumulates Float32 removals into Float64 in ascending canonical linear-site order for each ascending active cell slot. Portable profile accumulates Float32 and launches one fixed-width-256 reduction group per active cell; lane l visits matching canonical sites l,l+256,... in ascending order and a fixed pairwise tree combines lanes. Global maximum uses a fixed pairwise tree. Floating atomics and scheduler-dependent sums are forbidden."
failure_policy = "stale generation, nonpositive active-cell volume, nonfinite concentration/removal/total, zero or nonfinite calibration maximum, uninitialized multiplier in publish mode, capacity mismatch, or backend status failure commits nothing and reports the deterministic failure class plus canonical first failing site/cell when applicable."
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "intracellular_advance"
phase = 6
trigger = "one registered source start() advance before finalized Potts.jl MCS 0; then normalized target MCS 122:500, corresponding to source MCS > 120"
reads = ["signal", "intracellular_state"]
writes = ["intracellular_state"]
snapshot = "completed secretome_signal_exchange snapshot"
commit = "atomic synchronous commit"
numerical_policy = "drac/dt = a+s-0.1*rac over 2880 time units with a and s constant; source CPU oracle is RoadRunner/CVODE-equivalent and portable execution is tolerance-qualified against the closed-form affine solution"
rng_namespace = "wang/intracellular/rac-initialization"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "focal_parameter_retune"
phase = 7
trigger = "PeriodicMCS(1,10; stop=491), corresponding exactly to source MCS % 10 == 0 over source 0:499"
reads = ["MCS", "focal_relationships"]
writes = ["focal_strength", "focal_relationships payload only"]
snapshot = "completed intracellular_advance snapshot"
commit = "atomic synchronous relationship retune distinct from accepted-copy topology"
numerical_policy = "using derived source_mcs=target_mcs-1: strength=0 for source_mcs<120, 20 for 120<=source_mcs<210, scanned strength for source_mcs>=210; target length=8, maximum length=12"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "neighbor_polarity_alignment"
phase = 8
trigger = "normalized target MCS 122:500, corresponding to source MCS > 120"
reads = ["contact-neighbor graph", "self_polarity snapshot", "focal_strength"]
writes = ["self_polarity", "motility_force.alignment_fraction"]
snapshot = "all neighbor means reduced before any aligned polarity is published"
commit = "atomic synchronous commit"
numerical_policy = "p=min(focal_strength/1000,1)*0.4; normalize p*mean(neighbor self polarity)+(1-p)*self polarity; empty neighbor set contributes zero"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "protrusion_force_update"
phase = 9
trigger = "normalized target MCS 122:500, corresponding to source MCS > 120"
reads = ["self_polarity", "intracellular_state.rac", "scanned protrusion-force maximum"]
writes = ["motility_force"]
snapshot = "completed neighbor_polarity_alignment snapshot"
commit = "atomic synchronous commit"
numerical_policy = "h=rac^4/(40^4+rac^4); lambdaVec=-force_max*h*polarity; reported magnitude=force_max*h"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "relationship_lifecycle_cleanup"
phase = 10
trigger = "every completed MCS and every endpoint retirement"
reads = ["focal_relationships", "cell slot generations"]
writes = ["focal_relationships"]
snapshot = "completed process snapshot before observation"
commit = "deterministic canonical compaction"
backend_requirements = ["CPU", "Metal", "ROCm"]

[[process]]
id = "wang_observations"
phase = 11
trigger = "per-cell source record on normalized target MCS 122:500/source MCS >120; geometric observation primitives at target 91/source 90 and target 271/source 270; final classifier/UMAP execution remains Phase 14.3"
reads = ["cell identity", "centroid", "self_polarity", "intracellular_state", "signal", "motility_force", "focal_strength"]
writes = []
snapshot = "completed lifecycle snapshot"
commit = "read-only device reduction; host publication only at declared observation boundary"
backend_requirements = ["CPU", "Metal", "ROCm"]

[plan]
single_root = true
ordered_processes = [
    "potts_metropolis",
    "secretome_field_advance",
    "centroid_sample",
    "self_polarity_from_history",
    "secretome_signal_exchange",
    "intracellular_advance",
    "focal_parameter_retune",
    "neighbor_polarity_alignment",
    "protrusion_force_update",
    "relationship_lifecycle_cleanup",
    "wang_observations",
]
forbid_fragment_local_schedulers = true
forbid_hidden_callbacks = true
forbid_runtime_symbol_lookup = true
forbid_process_local_mcs_branching = true
source_mcs_is_derived_metadata = true

[plan.exchange_modes]
target_1_121 = "inactive"
target_122_210 = "reset"
target_211 = "calibrate"
target_212_500 = "publish"

[plan.stable_boundary]
kind = "completed MCS after required observation"
internal_field_substeps = false
post_field_phase = false
post_exchange_phase = false
partial_mcs_restart = false

[closure_protocol]
status = "open"
ledger = "phase-14-g3b-closure-ledger-v1.toml"
claim_checker = "../../scripts/check_phase14_g3b_closure.jl"
completion_claim = "G3-B complete"
completion_rule = "The completion claim is permitted only when every closure_requirement has status passed in the closure ledger, every referenced evidence artifact exists, every registered command exits successfully, and all three runtime-oracle rows are closed with immutable raw artifacts."
primitive_rule = "Passing a reusable primitive or a KernelAbstractions CPU oracle may close only that named increment. It cannot close the canonical Wang assembly, a foreign-runtime oracle, G3-B, or any real GPU backend."
profile_boundary = "G3-B requires the source-faithful sequential CPU model and portable structural/device-readiness evidence over the identical canonical plan. Real Metal and ROCm numerical execution, residency, device code, transfer, memory, and performance qualification are exclusively G3-C and may not redesign G3-B semantics."
stable_boundary_rule = "Only a completed target MCS after required observations is restartable. A closure fixture must reject capture after every earlier process phase and every internal field substep."
failure_rule = "Every mutating process proves candidate-only failure behavior, deterministic failure class and canonical first failing identity where applicable, unchanged authoritative state and semantic time, and unchanged publication epoch."
allocation_rule = "After construction and warm-up, every process in the canonical sequential CPU plan and the complete non-observing target-MCS transition allocate zero bytes. Caller-owned observation serialization and checkpoint output buffers are measured separately and may not hide process allocation."
evidence_rule = "Each closure artifact records the exact clean commit, dirty-state policy, Julia and package/runtime versions, platform, exact command, input hashes, raw output hash, assertion totals, and claim boundary."

[[closure_requirement]]
id = "source-provenance-lock"
scope = "Pinned Wang source revision, XML/Python/SBML inputs, paper identity, runtime/container identities, and cryptographic hashes."
required_evidence = ["source archive manifest", "license/provenance record", "runtime version manifest"]

[[closure_requirement]]
id = "canonical-wang-assembly"
scope = "One generic declaration lowers to one canonical 11-process root plan with all nine registered state families and no Wang-specific public runtime API."
required_evidence = ["canonical inspection artifact", "lowering fingerprint", "direct-versus-fragment identity", "bounded target-MCS 0:500 smoke"]

[[closure_requirement]]
id = "sequential-cpu-conformance"
scope = "Every source_faithful_cpu conformance row passes against the assembled model, not merely isolated primitives."
required_evidence = ["per-row assertion ledger", "assembled bounded-model trace", "analytic and invariant fixtures"]

[[closure_requirement]]
id = "order-and-boundaries"
scope = "Exact source k to target k+1 mapping, process order, attempt budget, and source 120/210/211 visibility are observed in the assembled trace."
required_evidence = ["ordinary-MCS trace", "target 121/122 trace", "target 211/212 trace", "attempt accounting trace"]

[[closure_requirement]]
id = "transaction-and-failure-atomicity"
scope = "Every mutating process and the Potts/relationship and field/cell/global cross-domain transactions satisfy the closure failure rule."
required_evidence = ["failure matrix", "publication-epoch trace", "authoritative-state before/after hashes"]

[[closure_requirement]]
id = "completed-mcs-restart"
scope = "Uninterrupted and restarted runs agree at declared target boundaries 0, 120, 121, 210, 211, 212, and 500; every partial-MCS capture point rejects."
required_evidence = ["checkpoint schema fingerprint", "restart comparison matrix", "partial-boundary rejection matrix"]

[[closure_requirement]]
id = "steady-state-resource-contract"
scope = "The complete sequential CPU transition and each process meet the allocation rule with preallocated bounded workspaces and deterministic overflow."
required_evidence = ["per-process allocation table", "whole-transition allocation result", "capacity and overflow truth table"]

[[closure_requirement]]
id = "portable-abi-readiness"
scope = "All canonical state, workspaces, process views, status, and transactions adapt together and execute through descriptor-free KernelAbstractions CPU oracles without host callbacks, scalar loops, hidden transfers, or runtime symbol lookup."
required_evidence = ["Adapt tree inventory", "device-storage validation", "launch/transfer trace", "conditional-publication fixtures"]

[[closure_requirement]]
id = "foreign-runtime-oracles"
scope = "The Potts boundary/attempt, RoadRunner, and CC3D field runtime oracles are closed from pinned raw artifacts before any complete-Wang claim."
required_evidence = ["three closed runtime-oracle records", "raw input/output hashes", "comparison reports under preregistered tolerances"]

[[closure_requirement]]
id = "observation-schema"
scope = "All G3-B observations have typed bounded schemas, exact source labels, deterministic ordering/reduction, restart continuity, and declared host-publication boundaries."
required_evidence = ["schema fingerprint", "record-order fixture", "target 91/271 fixtures", "restart continuity fixture"]

[[closure_requirement]]
id = "regression-and-api-freeze"
scope = "G3-A identity/lowering, Phase 13 API inventory and fingerprints, prior checkpoints, full CorePotts behavior, and repository structure remain accepted."
required_evidence = ["full test reports", "API diff report", "fingerprint checks", "structure checks"]

[[closure_requirement]]
id = "evidence-reproducibility"
scope = "The closure packet is commit-addressed, hash-complete, independently rerunnable, and contains no unsupported GPU or paper-reproduction claim."
required_evidence = ["closure ledger", "exact command manifest", "artifact hashes", "claim-boundary audit"]

[boundary_expectations.source_mcs_120]
target_mcs = 121
potts_focal_strength = 0.0
self_polarity_runs = false
intracellular_advance_runs = false
retune_strength = 20.0
first_source_potts_using_retune = 121
first_target_potts_using_retune = 122

[boundary_expectations.source_mcs_210]
target_mcs = 211
potts_focal_strength = 20.0
field_runs_before_exchange = true
exchange_removes_field_mass = true
exchange_writes_multiplier = true
exchange_writes_signal = false
ode_signal = 0.0
retune_writes_scanned_strength = true
force_reads_scanned_strength = true
first_source_potts_using_scanned_strength = 211
first_target_potts_using_scanned_strength = 212

[boundary_expectations.source_mcs_211]
target_mcs = 212
exchange_writes_signal = true
ode_reads_same_mcs_signal = true
potts_uses_force_from_source_mcs = 210
potts_uses_force_from_target_mcs = 211

[[conformance]]
id = "history-ring"
kind = "exact"
profiles = ["source_faithful_cpu", "portable"]
cases = ["ring wrap", "source t-minus-4", "named paper t-minus-5 sensitivity", "zero displacement", "restart with each head position"]

[[conformance]]
id = "intracellular-affine-ode"
kind = "analytic-tolerance"
profiles = ["source_faithful_cpu", "portable"]
cases = ["s=0", "constant nonzero s", "startup advance", "source MCS 210/target 211 zero signal", "source MCS 211/target 212 same-MCS signal", "completed-MCS restart"]

[[conformance]]
id = "periodic-field"
