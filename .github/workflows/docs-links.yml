name: Documentation links

on:
  workflow_dispatch:
    inputs:
      localmath_ref:
        description: Full LocalMath candidate commit SHA
        type: string
        default: d3d2e5533585de3b16dafbb8ba7c0cb265209254
      corepotts_ref:
        description: Full CorePotts candidate commit SHA
        type: string
        default: 84552135c107019bafb9ac91cc31d3c4ad930932

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: ${{ inputs.localmath_ref || 'd3d2e5533585de3b16dafbb8ba7c0cb265209254' }}
  COREPOTTS_REF: ${{ inputs.corepotts_ref || '84552135c107019bafb9ac91cc31d3c4ad930932' }}
  JULIA_NUM_PRECOMPILE_TASKS: 2
  JULIA_PKG_PRECOMPILE_AUTO: 0

jobs:
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate documentation environments
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(; julia_version_strict=true)'
      - name: Build documentation and check links
        env:
          POTTS_DEPLOY_DOCS: 'false'
          POTTS_DOCS_LINKCHECK: 'true'
        run: julia --project=docs --startup-file=no docs/make.jl
