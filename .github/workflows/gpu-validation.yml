name: GPU tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: '1.12'
  JULIA_NUM_PRECOMPILE_TASKS: 2

jobs:
  metal:
    name: Metal
    if: vars.METAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, metal]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _ci/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: _ci/source
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
          arch: aarch64
          force-arch: true
      - name: Instantiate Metal environment
        run: >-
          julia --project=benchmark/backends/metal --startup-file=no -e
          'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Run Metal smoke tests
        run: |
          julia --project=benchmark/backends/metal --startup-file=no --check-bounds=yes benchmark/tiled_smoke.jl --backend=metal
          julia --project=benchmark/backends/metal --startup-file=no --check-bounds=yes benchmark/matrix.jl --backend=metal --profile=smoke

  rocm:
    name: ROCm
    if: vars.ROCM_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, rocm]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _ci/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: _ci/source
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Instantiate ROCm environment
        run: >-
          julia --project=benchmark/backends/amdgpu --startup-file=no -e
          'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Run ROCm smoke tests
        run: |
          julia --project=benchmark/backends/amdgpu --startup-file=no --check-bounds=yes benchmark/tiled_smoke.jl --backend=amdgpu
          julia --project=benchmark/backends/amdgpu --startup-file=no --check-bounds=yes benchmark/matrix.jl --backend=amdgpu --profile=smoke

  cuda:
    name: CUDA
    if: vars.CUDA_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, cuda]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: _ci/source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: _ci/source
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Instantiate CUDA environment
        run: >-
          julia --project=benchmark/backends/cuda --startup-file=no -e
          'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Run CUDA smoke tests
        run: >-
          julia --project=benchmark/backends/cuda --startup-file=no --check-bounds=yes
          benchmark/matrix.jl --backend=cuda --profile=smoke
