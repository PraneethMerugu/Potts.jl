# CI on the maintainer's self-hosted ROCm PC (D-157).
# Runs only on pushes to `monorepo` and on manual dispatch, never on pull requests: the
# runner is a personal machine and the repository is public (fork PRs from outside
# contributors also need approval before any workflow runs).
# Jobs are pinned to logical CPUs 0-11,16-27; cores 12-15 (28-31) are reserved for benchmarks.
name: CI

on:
  push:
    branches: [monorepo]
    # Design notes, decisions and research docs change no code or test: skip CI for
    # pushes that touch only them (a push touching anything else still runs).
    paths-ignore:
      - 'docs/design/**'
  workflow_dispatch:
    inputs:
      update_deps:
        description: Resolve the dependencies afresh, not from the last green run's Manifest
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_PKG_PRECOMPILE_AUTO: "0"
  PIN: taskset -c 0-11,16-27

jobs:
  format:
    name: Runic formatting check (changed .jl files)
    runs-on: [self-hosted, Linux, X64, rocm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Julia on PATH
        run: echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Check changed lines in .jl files with GitRunic
        env:
          JULIA_PKG_OFFLINE: "true"
        run: |
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            BASE_REF="HEAD~1"
          fi
          $PIN julia --startup-file=no --project=.github/ci/runic -e '
            using Pkg
            Pkg.instantiate(; io = devnull)
            using Runic
            exit(Runic.GitRunic.main(["--diff", ARGS[1], "HEAD"]))
          ' -- "$BASE_REF"

  test:
    name: CPU suites and ROCm GPU group
    runs-on: [self-hosted, Linux, X64, rocm]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Julia on PATH
        run: echo "$HOME/.juliaup/bin" >> "$GITHUB_PATH"
      - name: Resolve, instantiate and precompile the workspace
        # Dependencies start from the last green run's Manifest (D-272): `Pkg.resolve` changes
        # only what the Projects require, so a new release of a dependency cannot break CI by
        # itself. Dispatch with `update_deps` to resolve afresh; the changes are printed.
        # Precompiled once, before the parallel step, so the parallel processes only read the
        # shared depot's compile cache (no concurrent precompilation of the same package).
        env:
          UPDATE_DEPS: ${{ inputs.update_deps }}
        run: |
          julia --version
          LOCK="$HOME/potts-ci/Manifest.toml"   # the last green run's Manifest on this runner
          if [ "$UPDATE_DEPS" != "true" ] && [ -f "$LOCK" ]; then cp "$LOCK" Manifest.toml; fi
          julia --project=. -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.precompile()'
          if [ -f "$LOCK" ]; then
            echo "Dependency changes against the last green run:"
            julia .github/ci/manifest_diff.jl "$LOCK" Manifest.toml
          fi
          for p in test lib/LatticeFields/test lib/LatticePDE/test lib/CorePotts/test lib/MakiePotts/test lib/PottsModels/test benchmark docs; do
            $PIN julia --project=$p -e 'using Pkg; Pkg.precompile()'
          done
      - name: Test suites in parallel (PottsModels ×3, GPU, Potts, LatticeFields + CorePotts + MakiePotts)
        # .github/ci/parallel.sh: one process per disjoint physical-core pair (with its SMT
        # siblings) on 0-11/16-27; each log is printed in its own group with its wall time and
        # exit code, and any failure fails this step. OPENVT_PACKAGE_BULK: the OpenVT package's
        # bulk inputs (the O1 archives and O2 files, ~320 MB, outside git; D-204, D-206), kept on
        # the runner under its home directory. The package test
        # (reproductions/15_openvt_package.jl) is red without them, by design.
        env:
          POTTS_CI_LOGS: ${{ runner.temp }}/potts-ci-logs
          POTTS_CI_COVERAGE: "1"
        run: OPENVT_PACKAGE_BULK="$HOME/potts-ci/openvt-bulk" bash .github/ci/parallel.sh
      - name: Coverage summary (non-gating, H4)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: $PIN julia --startup-file=no .github/ci/coverage_summary.jl --clean
      - name: Benchmark tooling tests (machine lock, exclusive.sh transition)
        # after the parallel step, alone on the cores: the A/B harness test times runs
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          for f in benchmark/test/*.jl; do
            $PIN julia --project=benchmark "$f"
          done
      - name: LatticeFields under --check-bounds=yes
        # Our tree had not been tested under --check-bounds, while eight installed SciML
        # workflows run --check-bounds=yes and OrdinaryDiffEq's passes `check-bounds: auto`.
        # It is the cheapest real defect detector available and needs no test edits.
        # Measured on 1.13.3 at the pin-free head: the LatticeFields group is 1588/1588 in
        # 9m53s under the flag (exit status 0), so the pass costs one cheap group. Add groups
        # here as each one is measured clean under the flag; do not add a group that has not
        # been.
        run: $PIN julia --check-bounds=yes --project=lib/LatticeFields/test lib/LatticeFields/test/runtests.jl
      - name: CorePotts under --check-bounds=yes
        # Measured on 1.13.4 on the PC (D-298): 262 s, exit status 0. The lane's control item
        # requires the flag when POTTS_CHECK_BOUNDS_LANE is set, and an out-of-bounds read
        # under `@inbounds` to throw. Potts under the flag takes about 26 min, so it runs
        # weekly instead (check-bounds-weekly.yml).
        run: POTTS_CHECK_BOUNDS_LANE=true $PIN julia --check-bounds=yes --project=lib/CorePotts/test lib/CorePotts/test/runtests.jl
      - name: Keep this Manifest as the dependency lock
        # only reached when every step above passed
        run: mkdir -p "$HOME/potts-ci" && cp Manifest.toml "$HOME/potts-ci/Manifest.toml"
