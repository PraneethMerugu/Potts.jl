name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: 1.12.6
  JULIA_NUM_PRECOMPILE_TASKS: 2

jobs:
  project:
    name: Project integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Phase 16.C verifies the trusted hardware-qualified source commit.
          fetch-depth: 0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Enforce repository and package structure
        run: julia --startup-file=no scripts/check_structure.jl
      - name: Enforce MakiePotts stable API and accessor boundary
        run: julia --startup-file=no scripts/check_makiepotts_contract.jl
      - name: Enforce MakiePotts release metadata and artifact hygiene
        run: julia --startup-file=no scripts/check_makiepotts_release.jl
      - name: Enforce Phase 13 legacy closure
        run: julia --startup-file=no scripts/check_legacy_containment.jl
      - name: Enforce Phase 14 corpus and simplified architecture closure
        run: julia --project=. --startup-file=no scripts/check_phase14_0.jl
      - name: Enforce ProcessBigraphs platform specification
        run: julia --startup-file=no scripts/check_process_bigraph_platform.jl
      - name: Enforce ProcessBigraphs PB0 bounded foundation
        run: julia --startup-file=no scripts/process-bigraph-pb0-check.jl
      - name: Enforce ProcessBigraphs Phase 15.A canonical structure
        run: julia --startup-file=no scripts/process-bigraph-phase15a-check.jl
      - name: Enforce ProcessBigraphs Phase 15.B open composition
        run: julia --startup-file=no scripts/process-bigraph-phase15b-check.jl
      - name: Enforce ProcessBigraphs Phase 15.C implementation and closure
        run: julia --startup-file=no scripts/process-bigraph-phase15c-entry-check.jl
      - name: Enforce ProcessBigraphs Phase 16.A boundary and open closure
        run: julia --startup-file=no scripts/process-bigraph-phase16-entry-check.jl
      - name: Enforce ProcessBigraphs Phase 16.B engine and field protocol
        run: julia --startup-file=no scripts/process-bigraph-phase16b-check.jl
      - name: Enforce ProcessBigraphs Phase 16.C native field qualification
        run: julia --startup-file=no scripts/process-bigraph-phase16c-check.jl
      - name: Enforce ProcessBigraphs Phase 16.D structural transactions
        run: julia --startup-file=no scripts/process-bigraph-phase16d-check.jl
      - name: Enforce ProcessBigraphs Phase 16.E CorePotts cutover
        run: julia --startup-file=no scripts/process-bigraph-phase16e-check.jl
      - name: Enforce ProcessBigraphs Phase 16.F solver-integration consolidation specification
        run: julia --startup-file=no scripts/process-bigraph-phase16f-consolidation-spec-check.jl
      - name: Enforce ProcessBigraphs Phase 16.F solver plurality qualification
        run: julia --startup-file=no scripts/process-bigraph-phase16f-check.jl
      - name: Enforce ProcessBigraphs Phase 16.G bounded Merks qualification
        run: julia --startup-file=no scripts/process-bigraph-phase16g-check.jl
      - name: Enforce ProcessBigraphs Phase 16.H bounded CNV qualification
        run: julia --startup-file=no scripts/process-bigraph-phase16h-check.jl
      - name: Enforce ProcessBigraphs Phase 16.HC raw-IR boundary
        run: julia --startup-file=no scripts/process-bigraph-phase16hc-ir-guard.jl
      - name: Enforce ProcessBigraphs Phase 16.HC high-level authoring qualification
        run: julia --startup-file=no scripts/process-bigraph-phase16hc-check.jl
      - name: Enforce ProcessBigraphs Phase 16 generated documentation
        run: julia --startup-file=no scripts/process-bigraph-phase16-docs.jl --check
      - name: Enforce ProcessBigraphs Phase 16.I reconciliation candidate
        run: julia --startup-file=no scripts/process-bigraph-phase16i-check.jl
      - name: Check ProcessBigraphs Phase 16.HC authoring performance guardrails
        run: julia --project=lib/ProcessBigraphs --startup-file=no benchmark/phase16hc_authoring_qualification.jl --events=128 --repetitions=5
      - name: Check ProcessBigraphs high-level authoring documentation
        run: julia --project=lib/ProcessBigraphs --startup-file=no lib/ProcessBigraphs/test/examples/high_level_authoring.jl
      - name: Verify ProcessBigraphs Phase 16 closure state
        run: |
          if grep -q 'implementation_status = "phase16_internal_beta_qualified"' \
              spec/process-bigraph-phase16-entry-v1.toml; then
            julia --startup-file=no scripts/process-bigraph-phase16-closure-check.jl
          else
            julia --startup-file=no scripts/process-bigraph-phase16-closure-check.jl --expect-open
          fi
      - name: Enforce Phase 14 Wang sequential CPU disposition
        run: julia --project=. --startup-file=no scripts/check_phase14_wang_disposition.jl
      - name: Resolve the package workspace without mutation
        run: |
          julia --project=. --startup-file=no -e '
            using Pkg
            Pkg.instantiate(; workspace=true, julia_version_strict=true,
                allow_autoprecomp=false)'
      - name: Enforce exhaustive Phase 13 API inventory
        run: julia --project=. --startup-file=no scripts/check_phase13_api_inventory.jl
      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Closure archives preserve exact, content-addressed command and
          # hardware output bytes. Their hashes are checked independently;
          # whitespace normalization would invalidate admitted evidence.
          EVIDENCE_EXCLUSIONS=(
            ':(exclude,glob)design/evidence/phase-14/g3b-closure/**'
          )
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD -- . "${EVIDENCE_EXCLUSIONS[@]}"
          else
            git diff --check HEAD^ HEAD -- . "${EVIDENCE_EXCLUSIONS[@]}"
          fi

  packages:
    name: Package / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: PottsToolkit
            project: .
          - package: CorePotts
            project: lib/CorePotts
          - package: MakiePotts
            project: lib/MakiePotts
          - package: ProcessBigraphs
            project: lib/ProcessBigraphs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Install, load, and exercise package from a clean temporary project
        env:
          PACKAGE: ${{ matrix.package }}
          PROJECT: ${{ matrix.project }}
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop(path=abspath(ENV["PROJECT"]))
            Pkg.instantiate(; julia_version_strict=true)
            if ENV["PACKAGE"] == "CorePotts"
                @eval using CorePotts
                profile = CorePotts.algorithm_guarantees(CorePotts.SequentialCPM())
                profile.proposal_process.recipient === :uniform_with_replacement ||
                    error("CorePotts public exercise failed")
            elseif ENV["PACKAGE"] == "MakiePotts"
                Pkg.add(Pkg.PackageSpec(name="CairoMakie", version="0.15"))
                include(abspath("lib/MakiePotts/test/clean_install_smoke.jl"))
            elseif ENV["PACKAGE"] == "ProcessBigraphs"
                @eval using ProcessBigraphs
                state_path = ProcessBigraphs.path(:cell, :mass)
                sprint(show, state_path) == "/cell/mass" ||
                    error("ProcessBigraphs path exercise failed")
                scale = ProcessBigraphs.TimeScale(1, 4)
                ProcessBigraphs.physical_value(ProcessBigraphs.LogicalTime(2, scale)) == 1 // 2 ||
                    error("ProcessBigraphs exact-time exercise failed")
            else
                @eval using PottsToolkit
                algorithm = PottsToolkit.CheckerboardSweepCPM()
                algorithm.temperature == 20.0f0 ||
                    error("PottsToolkit public exercise failed")
                PottsToolkit.scientific_contract_versions().authoring_dsl == v"1.0.0" ||
                    error("PottsToolkit contract exercise failed")
            end'
      - name: Test package independently
        env:
          PACKAGE: ${{ matrix.package }}
          PROJECT: ${{ matrix.project }}
        run: |
          julia --project="$PROJECT" --startup-file=no -e '
            using Pkg
            Pkg.test(ENV["PACKAGE"]; julia_args=["--startup-file=no"])'

  makie_backends:
    name: MakiePotts / Cairo + GL + WGL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate backend qualification environment
        run: |
          julia --project=lib/MakiePotts/test/backends --startup-file=no -e '
            using Pkg
            Pkg.instantiate(; julia_version_strict=true)'
      - name: CairoMakie render, update, framebuffer, and save
        run: |
          julia --project=lib/MakiePotts/test/backends --startup-file=no \
            lib/MakiePotts/test/backends/cairo.jl "$RUNNER_TEMP/makiepotts-cairo.png"
      - name: Tolerant CairoMakie visual regression
        id: visual_regression
        env:
          MAKIEPOTTS_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/makiepotts-visual-regression
        run: |
          julia --project=lib/MakiePotts/test/backends --startup-file=no \
            lib/MakiePotts/test/visual_regression.jl
      - name: Upload visual-regression failure evidence
        if: ${{ steps.visual_regression.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: makiepotts-visual-regression
          path: ${{ runner.temp }}/makiepotts-visual-regression
          if-no-files-found: error
      - name: GLMakie offscreen render, update, framebuffer, and cleanup
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            julia --project=lib/MakiePotts/test/backends --startup-file=no \
            lib/MakiePotts/test/backends/gl.jl
      - name: Run native MakiePotts example from its declared environment
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          julia --project=examples --startup-file=no -e '
            using Pkg
            Pkg.instantiate(; julia_version_strict=true)'
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            julia --project=examples --startup-file=no examples/makiepotts_native.jl
      - name: WGLMakie render, update, and HTML serialization
        run: |
          julia --project=lib/MakiePotts/test/backends --startup-file=no \
            lib/MakiePotts/test/backends/wgl.jl

  integration:
    name: Integration / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [thermodynamics, biophysics, integration, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_GROUP: CPU
      POTTS_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate integration environment
        run: |
          julia --project=integration --startup-file=no -e '
            using Pkg
            Pkg.instantiate(; julia_version_strict=true, allow_autoprecomp=false)'
      - name: Run cross-package integration shard
        run: julia --project=integration --startup-file=no integration/runtests.jl

  phase15c_oracle:
    name: Phase 15.C independent oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Run isolated production, stdlib-only oracle, and comparator processes
        run: julia --startup-file=no scripts/process-bigraph-phase15c-oracle.jl

  phase15c_candidate:
    name: Phase 15.C candidate evidence
    needs: [project, packages, integration, phase15c_oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Recheck Phase 15.C qualification ledger
        run: julia --startup-file=no scripts/process-bigraph-phase15c-entry-check.jl
      - name: Measure Phase 15.C performance guardrails
        run: |
          julia --project=lib/ProcessBigraphs --startup-file=no -e '
            using Pkg
            Pkg.instantiate(; julia_version_strict=true)'
          julia --project=lib/ProcessBigraphs --startup-file=no scripts/process-bigraph-phase15c-guardrails.jl phase15c-guardrails.toml
      - name: Generate exact-head candidate evidence
        run: julia --startup-file=no scripts/process-bigraph-phase15c-candidate.jl phase15c-candidate.toml phase15c-guardrails.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: process-bigraphs-phase15c-candidate
          path: |
            phase15c-candidate.toml
            phase15c-guardrails.toml
          if-no-files-found: error
          retention-days: 30

  phase16i_candidate:
    name: Phase 16.I exact-head candidate evidence
    needs: [project, packages, integration, phase15c_oracle, phase15c_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Recheck Phase 16.I reconciliation
        run: julia --startup-file=no scripts/process-bigraph-phase16i-check.jl
      - name: Recheck generated capability documentation
        run: julia --startup-file=no scripts/process-bigraph-phase16-docs.jl --check
      - name: Measure frozen Phase 16 authoring guardrails
        run: >-
          julia --project=lib/ProcessBigraphs --startup-file=no
          benchmark/phase16hc_authoring_qualification.jl
          --events=128 --repetitions=9
          --output=${{ runner.temp }}/phase16i-authoring-performance.toml
      - name: Prepare exact-head Phase 16.I candidate
        env:
          PHASE16_BASE_REF: origin/main
        run: |
          if grep -q 'implementation_status = "phase16i_candidate"' \
              spec/process-bigraph-phase16-entry-v1.toml; then
            julia --startup-file=no \
              scripts/process-bigraph-phase16i-candidate.jl \
              "$RUNNER_TEMP/phase16i-candidate.toml" \
              "$RUNNER_TEMP/phase16i-authoring-performance.toml"
          else
            cp design/evidence/phase-16/phase16i-candidate.toml \
              "$RUNNER_TEMP/phase16i-candidate.toml"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: process-bigraphs-phase16i-candidate
          path: |
            ${{ runner.temp }}/phase16i-candidate.toml
            ${{ runner.temp }}/phase16i-authoring-performance.toml
          if-no-files-found: error
          retention-days: 30

  cpu_macos_arm64:
    name: CPU / macOS ARM64 / Julia 1.12.6
    if: >-
      vars.METAL_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: [self-hosted, metal]
    timeout-minutes: 45
    env:
      BACKEND_GROUP: CPU
    defaults:
      run:
        working-directory: _ci/source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: _ci/source
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
          arch: aarch64
          force-arch: true
      - name: Verify ARM64 runtime
        run: julia --startup-file=no -e 'Sys.ARCH == :aarch64 || error("expected ARM64 Julia; found $(Sys.ARCH)")'
      - name: Test CorePotts, PottsToolkit, and ProcessBigraphs independently
        run: |
          julia --project=lib/CorePotts --startup-file=no -e 'using Pkg; Pkg.test("CorePotts"; julia_args=["--startup-file=no"])'
          julia --project=. --startup-file=no -e 'using Pkg; Pkg.test("PottsToolkit"; julia_args=["--startup-file=no"])'
          julia --project=lib/ProcessBigraphs --startup-file=no -e 'using Pkg; Pkg.test("ProcessBigraphs"; julia_args=["--startup-file=no"])'
      - name: Run complete cross-package integration suite
        run: |
          julia --project=integration --startup-file=no -e 'using Pkg; Pkg.instantiate(; julia_version_strict=true, allow_autoprecomp=false)'
          julia --project=integration --startup-file=no integration/runtests.jl

  cpu_linux_x64:
    name: CPU / Linux x86_64 / Julia 1.12.6
    if: >-
      vars.ROCM_RUNNER_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: [self-hosted, rocm]
    timeout-minutes: 45
    env:
      BACKEND_GROUP: CPU
    defaults:
      run:
        working-directory: _ci/source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: _ci/source
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Verify x86_64 runtime
        run: julia --startup-file=no -e 'Sys.ARCH == :x86_64 || error("expected x86_64 Julia; found $(Sys.ARCH)")'
      - name: Test CorePotts, PottsToolkit, and ProcessBigraphs independently
        run: |
          julia --project=lib/CorePotts --startup-file=no -e 'using Pkg; Pkg.test("CorePotts"; julia_args=["--startup-file=no"])'
          julia --project=. --startup-file=no -e 'using Pkg; Pkg.test("PottsToolkit"; julia_args=["--startup-file=no"])'
          julia --project=lib/ProcessBigraphs --startup-file=no -e 'using Pkg; Pkg.test("ProcessBigraphs"; julia_args=["--startup-file=no"])'
      - name: Run complete cross-package integration suite
        run: |
          julia --project=integration --startup-file=no -e 'using Pkg; Pkg.instantiate(; julia_version_strict=true, allow_autoprecomp=false)'
          julia --project=integration --startup-file=no integration/runtests.jl

  required:
    name: Required
    if: always()
    needs: [project, packages, makie_backends, integration, phase15c_oracle, phase15c_candidate, phase16i_candidate, cpu_macos_arm64, cpu_linux_x64]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job
        env:
          PROJECT_RESULT: ${{ needs.project.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          MAKIE_BACKENDS_RESULT: ${{ needs.makie_backends.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PHASE15C_ORACLE_RESULT: ${{ needs.phase15c_oracle.result }}
          PHASE15C_CANDIDATE_RESULT: ${{ needs.phase15c_candidate.result }}
          PHASE16I_CANDIDATE_RESULT: ${{ needs.phase16i_candidate.result }}
          MACOS_RESULT: ${{ needs.cpu_macos_arm64.result }}
          LINUX_X64_RESULT: ${{ needs.cpu_linux_x64.result }}
          METAL_ENABLED: ${{ vars.METAL_RUNNER_ENABLED }}
          ROCM_ENABLED: ${{ vars.ROCM_RUNNER_ENABLED }}
          TRUSTED_SELF_HOSTED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          test "$PROJECT_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$MAKIE_BACKENDS_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$PHASE15C_ORACLE_RESULT" = success
          test "$PHASE15C_CANDIDATE_RESULT" = success
          test "$PHASE16I_CANDIDATE_RESULT" = success
          if [ "$METAL_ENABLED" = true ] && [ "$TRUSTED_SELF_HOSTED" = true ]; then
            test "$MACOS_RESULT" = success
          else
            test "$MACOS_RESULT" = skipped
          fi
          if [ "$ROCM_ENABLED" = true ] && [ "$TRUSTED_SELF_HOSTED" = true ]; then
            test "$LINUX_X64_RESULT" = success
          else
            test "$LINUX_X64_RESULT" = skipped
          fi
