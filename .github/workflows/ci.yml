name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'

jobs:
  package:
    name: package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test Potts
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'

  macos-smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test macOS package surface
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2", "test_public_api", "test_system_contract", "test_fresh_process"])'

  macos-package:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Complete macOS package tests
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test integration
        run: julia --project=integration --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(); include("integration/runtests.jl")'

  exact-replay:
    # The closed replay row is qualified on Darwin/aarch64 with Julia 1.12.1.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '1.12.1'}
      - uses: julia-actions/cache@v3
      - name: Test exact replay environment
        run: julia --project=integration/replay --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true); include("integration/replay/runtests.jl")'

  metal:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - name: Instantiate qualified Metal profile
        run: julia --project=benchmark/backends/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true)'
      - name: Test extension loading
        run: julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl extension_load_order.jl
      - name: Test relationship lifecycle stages
        run: julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl corepotts_relationship_stages.jl
      - name: Test relationship energy
        run: julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl corepotts_relationship_energy.jl
      - name: Test native component execution
        run: julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl native_component_execution.jl
