name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      localmath_ref:
        description: Full LocalMath candidate commit SHA
        type: string
        default: f41a37da99c31781d4d2b23678a8e729845306a1
      corepotts_ref:
        description: Full CorePotts candidate commit SHA
        type: string
        default: ddb52a9272777f442ab4194c7c16423aee169f28
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: ${{ inputs.localmath_ref || 'f41a37da99c31781d4d2b23678a8e729845306a1' }}
  COREPOTTS_REF: ${{ inputs.corepotts_ref || 'ddb52a9272777f442ab4194c7c16423aee169f28' }}

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      execution: ${{ steps.diff.outputs.execution }}
      compiler: ${{ steps.diff.outputs.compiler }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {fetch-depth: 0}
      - name: Select execution checks from the whole PR diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          execution=true
          compiler=true
          if [[ "$EVENT" == pull_request ]] && git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD^{commit}"; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/potts-changed-paths"
            execution=false
            compiler=false
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|CONTRIBUTING.md|README.md|LICENSE|CITATION.cff|spec/*.md|design/*.md) ;;
                *) execution=true ;;
              esac
              case "$path" in
                .github/workflows/ci.yml|Project.toml|benchmark/Project.toml|benchmark/compiler_contract_schema.jl|benchmark/resolved_aggregate_contract.jl|test/test_resolved_aggregate_compiler_report.jl|src/compiler/*|src/compiler/**|src/completion/*|src/completion/**|src/runtime/problem.jl|src/runtime/integrator.jl|src/runtime/symbolic_indexing.jl|src/symbolics/operations.jl) compiler=true ;;
              esac
            done < "$RUNNER_TEMP/potts-changed-paths"
          fi
          printf 'execution=%s\n' "$execution" >> "$GITHUB_OUTPUT"
          printf 'compiler=%s\n' "$compiler" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  package-shard:
    if: github.event_name != 'schedule'
    name: package / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    strategy:
      fail-fast: false
      matrix:
        shard:
          - declaration_and_structure
          - quantities_and_publication
          - execution_and_integration
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\nshard\t%s\n' \
            '${{ steps.julia-cache.outputs.cache-hit }}' \
            '${{ steps.julia-cache.outputs.cache-key }}' \
            '${{ matrix.shard }}' >> "$CI_CONTEXT_FILE"
      - name: Test Potts shard
        env:
          POTTS_TEST_SHARD: ${{ matrix.shard }}
        run: .github/ci/run-phase.sh package-test bash -o pipefail -c 'julia --startup-file=no -e '\''using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2", "--verbose", "--shard=$(ENV["POTTS_TEST_SHARD"])"])'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload package telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-package-telemetry-${{ matrix.shard }}-${{ github.sha }}
          path: ci-telemetry

  package:
    if: always() && github.event_name != 'schedule'
    needs: package-shard
    name: package (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Require every package shard
        env:
          PACKAGE_SHARDS_RESULT: ${{ needs.package-shard.result }}
        run: test "$PACKAGE_SHARDS_RESULT" = success

  macos-smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Test macOS public trajectory
        run: .github/ci/run-phase.sh macos-smoke bash -o pipefail -c 'julia --startup-file=no -e '\''using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=1", "test_platform_smoke"])'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload macOS smoke telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-macos-smoke-telemetry-${{ github.sha }}
          path: ci-telemetry

  macos-package:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Complete macOS package tests
        run: .github/ci/run-phase.sh macos-package bash -o pipefail -c 'julia --startup-file=no -e '\''using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload macOS package telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-macos-package-telemetry-${{ github.sha }}
          path: ci-telemetry

  integration:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Test integration
        run: .github/ci/run-phase.sh integration bash -o pipefail -c 'julia --project=integration --startup-file=no -e '\''using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(); include("integration/runtests.jl")'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload integration telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-integration-telemetry-${{ github.sha }}
          path: ci-telemetry

  exact-replay:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    # The closed replay row uses the repository Julia 1.12.6 runtime.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Test exact replay environment
        run: .github/ci/run-phase.sh exact-replay bash -o pipefail -c 'julia --project=integration/replay --startup-file=no -e '\''using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true); include("integration/replay/runtests.jl")'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload replay telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-replay-telemetry-${{ github.sha }}
          path: ci-telemetry

  compiler-evidence:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.compiler != 'false')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
      JULIA_DEBUG: loading
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.compiler != 'true' && needs.changes.outputs.compiler != 'false')
        run: exit 1
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Resolve compiler-evidence environment
        run: .github/ci/run-phase.sh compiler-environment julia --project=benchmark --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate()'
      - name: Record resolved aggregate compiler evidence
        run: .github/ci/run-phase.sh compiler-evidence julia --project=benchmark --startup-file=no benchmark/resolved_aggregate_contract.jl --revision-label=${{ github.sha }} --evidence-reason=Kaimon-is-not-installed-in-the-CI-evidence-environment --output=resolved-aggregate-compiler.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-aggregate-compiler-${{ github.sha }}
          path: |
            resolved-aggregate-compiler.toml
            benchmark/Manifest.toml
            ci-telemetry

  metal_shards:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    name: metal shard (${{ matrix.semantic_shard }})
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    strategy:
      fail-fast: false
      matrix:
        semantic_shard:
          - authoring_and_state
          - quantities_and_components
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\nmetal_shard\t%s\n' \
            '${{ steps.julia-cache.outputs.cache-hit }}' \
            '${{ steps.julia-cache.outputs.cache-key }}' \
            '${{ matrix.semantic_shard }}' >> "$CI_CONTEXT_FILE"
      - name: Instantiate qualified Metal profile
        run: .github/ci/run-phase.sh metal-environment julia --project=benchmark/backends/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true)'
      - name: Test qualified Metal profile
        run: .github/ci/run-phase.sh metal-test bash -o pipefail -c 'julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl "${{ matrix.semantic_shard }}" 2>&1 | tee ci-telemetry/test.log'
      - name: Upload Metal telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-metal-telemetry-${{ matrix.semantic_shard }}-${{ github.sha }}
          path: ci-telemetry

  metal:
    needs: [changes, metal_shards]
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Metal semantic shard
        env:
          SHARDS_RESULT: ${{ needs.metal_shards.result }}
        run: test "$SHARDS_RESULT" = success

  sibling-main:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_TELEMETRY_FILE: ci-telemetry/phases.tsv
      CI_CONTEXT_FILE: ci-telemetry/context.tsv
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - id: julia-cache
        uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Record qualification context
        run: |
          .github/ci/record-context.sh
          printf 'cache_hit\t%s\ncache_key\t%s\n' '${{ steps.julia-cache.outputs.cache-hit }}' '${{ steps.julia-cache.outputs.cache-key }}' >> "$CI_CONTEXT_FILE"
      - name: Test sibling main branches
        run: .github/ci/run-phase.sh sibling-main bash -o pipefail -c 'julia --startup-file=no -e '\''using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'\'' 2>&1 | tee ci-telemetry/test.log'
      - name: Upload sibling-main telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potts-sibling-main-telemetry-${{ github.sha }}
          path: ci-telemetry
