name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      localmath_ref:
        description: Full LocalMath candidate commit SHA
        type: string
        default: f41a37da99c31781d4d2b23678a8e729845306a1
      corepotts_ref:
        description: Full CorePotts candidate commit SHA
        type: string
        default: 418197ba9503e2af7d1a4e2fc89d499f27a05ac2
  schedule:
    - cron: '23 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: ${{ inputs.localmath_ref || 'f41a37da99c31781d4d2b23678a8e729845306a1' }}
  COREPOTTS_REF: ${{ inputs.corepotts_ref || '418197ba9503e2af7d1a4e2fc89d499f27a05ac2' }}

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      execution: ${{ steps.diff.outputs.execution }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {fetch-depth: 0}
      - name: Select execution checks from the whole PR diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          execution=true
          if [[ "$EVENT" == pull_request ]] && git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD^{commit}"; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/potts-changed-paths"
            execution=false
            while IFS= read -r -d '' path; do
              case "$path" in
                AGENTS.md|CONTRIBUTING.md|README.md|LICENSE|CITATION.cff|spec/*.md|design/*.md) ;;
                *) execution=true; break ;;
              esac
            done < "$RUNNER_TEMP/potts-changed-paths"
          fi
          printf 'execution=%s\n' "$execution" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

  package:
    if: github.event_name != 'schedule'
    name: package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Test Potts
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2", "--verbose"])'

  macos-smoke:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Test macOS public trajectory
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=1", "test_platform_smoke"])'

  macos-package:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Complete macOS package tests
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'

  integration:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate candidate revisions
        shell: bash
        run: |
          for revision in "$LOCALMATH_REF" "$COREPOTTS_REF"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full lowercase commit SHA"; exit 1; }
          done
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Test integration
        run: julia --project=integration --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(); include("integration/runtests.jl")'

  exact-replay:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    # The closed replay row uses the repository Julia 1.12.6 runtime.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Test exact replay environment
        run: julia --project=integration/replay --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true); include("integration/replay/runtests.jl")'

  metal:
    needs: changes
    if: always() && github.event_name != 'schedule' && (needs.changes.result != 'success' || needs.changes.outputs.execution != 'false')
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Require a valid change selection
        if: needs.changes.result != 'success' || (needs.changes.outputs.execution != 'true' && needs.changes.outputs.execution != 'false')
        run: exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate qualified Metal profile
        run: julia --project=benchmark/backends/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(; julia_version_strict=true)'
      - name: Test qualified Metal profile
        run: julia --project=benchmark/backends/metal --startup-file=no benchmark/backends/metal/runtests.jl

  sibling-main:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - name: Show tested source revisions
        run: |
          git rev-parse HEAD
          git -C deps/LocalMath rev-parse HEAD
          git -C deps/CorePotts rev-parse HEAD
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Test sibling main branches
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts"; test_args=["--jobs=2"])'
