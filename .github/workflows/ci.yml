name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: 'v0.2.0-rc1'
  COREPOTTS_REF: 'v0.2.0-rc1'

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test Potts
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts")'

  integration:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test integration
        run: julia --project=integration --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(); include("integration/runtests.jl")'

  exact-replay:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '1.12.1'}
      - uses: julia-actions/cache@v3
      - name: Test exact replay environment
        run: julia --project=integration/replay --startup-file=no integration/replay/runtests.jl

  metal:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: '${{ env.LOCALMATH_REF }}', path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: '${{ env.COREPOTTS_REF }}', path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Test qualified Metal profile
        run: julia --project=benchmark/backends/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.instantiate(); include("benchmark/backends/metal/runtests.jl")'

  sibling-main:
    if: github.event_name == 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/LocalMath.jl, ref: main, path: deps/LocalMath}
      - uses: actions/checkout@v6
        with: {repository: PraneethMerugu/CorePotts.jl, ref: main, path: deps/CorePotts}
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - name: Test sibling main branches
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", "deps/CorePotts", ".")]); Pkg.test("Potts")'
