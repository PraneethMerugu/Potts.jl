name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_NUM_PRECOMPILE_TASKS: 2

jobs:
  package-tests:
    name: Test / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: PottsToolkit
            project: .
            os: macos-15
            julia: '1.12.6'
          - package: CorePotts
            project: lib/CorePotts
            os: macos-15
            julia: '1.12.6'
          - package: LocalWorksets
            project: lib/LocalWorksets
            os: macos-15
            julia: '1.12.6'
          - package: MakiePotts
            project: lib/MakiePotts
            os: ubuntu-latest
            julia: '1.12.6'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Run package tests
        env:
          PACKAGE: ${{ matrix.package }}
          PROJECT: ${{ matrix.project }}
        run: >-
          julia --project="$PROJECT" --startup-file=no -e
          'using Pkg;
          Pkg.test(ENV["PACKAGE"]; julia_args=["--startup-file=no"])'

  integration:
    name: Integration
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate integration environment
        run: >-
          julia --project=integration --startup-file=no -e
          'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Run cross-package tests
        run: julia --project=integration --startup-file=no integration/runtests.jl

  documentation:
    name: Documentation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Instantiate documentation environment
        run: >-
          julia --project=docs --startup-file=no -e
          'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Build strict documentation
        run: julia --project=docs --startup-file=no docs/make.jl

  platform-smoke:
    name: Smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.12.6'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Install and run a tiny public sequential trajectory
        run: >-
          julia --startup-file=no -e
          'using Pkg;
          Pkg.activate(; temp=true);
          Pkg.develop(path=pwd());
          include("test/platform_smoke.jl")'
