name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  JULIA_VERSION: '1.12'
  JULIA_NUM_PRECOMPILE_TASKS: 2
  JULIA_PKG_PRECOMPILE_AUTO: 0

jobs:
  docs:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ env.JULIA_VERSION }}
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate documentation environments
        run: |
          julia --project=docs --startup-file=no -e 'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
          julia --project=lib/ProcessBigraphs/docs --startup-file=no -e 'using Pkg; Pkg.instantiate(; julia_version_strict=true)'
      - name: Build Potts documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          POTTS_DEPLOY_DOCS: ${{ github.event_name == 'push' }}
        run: julia --project=docs --startup-file=no docs/make.jl
      - name: Build ProcessBigraphs documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          PROCESS_BIGRAPHS_DEPLOY_DOCS: ${{ github.event_name == 'push' }}
        run: >-
          julia --project=lib/ProcessBigraphs/docs --startup-file=no
          lib/ProcessBigraphs/docs/make.jl
