name: Ecosystem integration

on:
  workflow_dispatch:
    inputs:
      localmath_revision:
        description: Exact LocalMath commit SHA
        required: true
        type: string
      corepotts_revision:
        description: Exact CorePotts commit SHA
        required: true
        type: string
      potts_revision:
        description: Exact Potts commit SHA
        required: true
        type: string
      makiepotts_revision:
        description: Exact MakiePotts commit SHA
        required: true
        type: string

      models_repository:
        description: Optional PottsModels owner/repository; pair with models_revision
        required: false
        type: string
      models_revision:
        description: Optional full PottsModels commit SHA; pair with models_repository
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.ref }}
  cancel-in-progress: false

env:
  JULIA_VERSION: '1.12.6'
  JULIA_NUM_PRECOMPILE_TASKS: 2
  JULIA_PKG_PRECOMPILE_AUTO: 0

jobs:
  cpu-and-documentation:
    name: CPU, documentation, and rendering
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Validate immutable revisions
        env:
          LOCALMATH_REVISION: ${{ inputs.localmath_revision }}
          COREPOTTS_REVISION: ${{ inputs.corepotts_revision }}
          POTTS_REVISION: ${{ inputs.potts_revision }}
          MAKIEPOTTS_REVISION: ${{ inputs.makiepotts_revision }}
          MODELS_REPOSITORY: ${{ inputs.models_repository }}
          MODELS_REVISION: ${{ inputs.models_revision }}
        run: |
          for revision in "$LOCALMATH_REVISION" "$COREPOTTS_REVISION" "$POTTS_REVISION" "$MAKIEPOTTS_REVISION"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "revision must be a full commit SHA: $revision"; exit 1; }
          done
          if [[ -n "$MODELS_REPOSITORY" || -n "$MODELS_REVISION" ]]; then
            [[ "$MODELS_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "Supply an explicit Models owner/repository"; exit 1; }
            [[ "$MODELS_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Supply a full Models commit SHA"; exit 1; }
          else
            echo "PottsModels was not selected; this run covers only the four supplied repositories."
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: ${{ inputs.localmath_revision }}
          path: ecosystem/LocalMath
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/CorePotts.jl
          ref: ${{ inputs.corepotts_revision }}
          path: ecosystem/CorePotts
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/Potts.jl
          ref: ${{ inputs.potts_revision }}
          path: ecosystem/Potts
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/MakiePotts.jl
          ref: ${{ inputs.makiepotts_revision }}
          path: ecosystem/MakiePotts
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: inputs.models_repository != ''
        with:
          repository: ${{ inputs.models_repository }}
          ref: ${{ inputs.models_revision }}
          path: ecosystem/PottsModels
      - name: Show tested source revisions
        env:
          MODELS_REPOSITORY: ${{ inputs.models_repository }}
        run: |
          for package in LocalMath CorePotts Potts MakiePotts; do
            printf '%s ' "$package"
            git -C "ecosystem/$package" rev-parse HEAD
          done
          if [[ -n "$MODELS_REPOSITORY" ]]; then
            printf 'PottsModels '
            git -C ecosystem/PottsModels rev-parse HEAD
          fi
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Fresh ecosystem load
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.develop([PackageSpec(path=path) for path in (
                "ecosystem/LocalMath", "ecosystem/CorePotts",
                "ecosystem/Potts", "ecosystem/MakiePotts",
            )])
            using LocalMath, CorePotts, Potts, MakiePotts
          '
      - name: LocalMath package and scientific tests
        run: |
          julia --project=ecosystem/LocalMath --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2", "--verbose"])'
          julia --project=ecosystem/LocalMath/test/scientific_witnesses --startup-file=no -e 'using Pkg; Pkg.develop(path="ecosystem/LocalMath"); Pkg.instantiate(); include("ecosystem/LocalMath/test/scientific_witnesses/runtests.jl")'
      - name: CorePotts package tests
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts")]); Pkg.test("CorePotts"; test_args=["--jobs=2", "--verbose"])'
      - name: Potts package and integration tests
        run: |
          julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts")]); Pkg.test("Potts"; test_args=["--jobs=2", "--verbose"])'
          julia --project=ecosystem/Potts/integration --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts")]); Pkg.instantiate(); include("ecosystem/Potts/integration/runtests.jl")'
      - name: PottsModels public-consumer tests and tutorials
        if: inputs.models_repository != ''
        run: |
          julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts", "ecosystem/PottsModels")]); Pkg.test("PottsModels")'
          julia --project=ecosystem/PottsModels/docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts", "ecosystem/PottsModels")]); Pkg.instantiate(); include("ecosystem/PottsModels/docs/make.jl")'
      - name: MakiePotts package tests
        run: julia --startup-file=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts", "ecosystem/MakiePotts")]); Pkg.test("MakiePotts")'
      - name: Documentation and doctests
        run: |
          julia --project=ecosystem/LocalMath/docs --startup-file=no -e 'using Pkg; Pkg.develop(path="ecosystem/LocalMath"); Pkg.instantiate(); include("ecosystem/LocalMath/docs/make.jl")'
          julia --project=ecosystem/CorePotts/docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts")]); Pkg.instantiate(); include("ecosystem/CorePotts/docs/make.jl")'
          julia --project=ecosystem/Potts/docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts")]); Pkg.instantiate(); include("ecosystem/Potts/docs/make.jl")'
          julia --project=ecosystem/MakiePotts/docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts", "ecosystem/MakiePotts")]); Pkg.instantiate(); include("ecosystem/MakiePotts/docs/make.jl")'
      - name: Prepare Makie backend environment
        run: xvfb-run -a julia --project=ecosystem/MakiePotts/test/backends --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts", "ecosystem/MakiePotts")]); Pkg.instantiate(); Pkg.precompile()'
      - name: Makie backend and visual tests
        run: |
          julia --project=ecosystem/MakiePotts/test/backends --startup-file=no ecosystem/MakiePotts/test/backends/cairo.jl
          julia --project=ecosystem/MakiePotts/test/backends --startup-file=no ecosystem/MakiePotts/test/backends/wgl.jl
          xvfb-run -a julia --project=ecosystem/MakiePotts/test/backends --startup-file=no ecosystem/MakiePotts/test/backends/gl.jl
          julia --project=ecosystem/MakiePotts/test/backends --startup-file=no ecosystem/MakiePotts/test/clean_install_smoke.jl
          julia --project=ecosystem/MakiePotts/test/backends --startup-file=no ecosystem/MakiePotts/test/visual_regression.jl

  macos:
    name: Candidate-tuple Metal and continuation
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Validate immutable revisions
        env:
          LOCALMATH_REVISION: ${{ inputs.localmath_revision }}
          COREPOTTS_REVISION: ${{ inputs.corepotts_revision }}
          POTTS_REVISION: ${{ inputs.potts_revision }}
        run: |
          for revision in "$LOCALMATH_REVISION" "$COREPOTTS_REVISION" "$POTTS_REVISION"; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "revision must be a full commit SHA: $revision"; exit 1; }
          done
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: ${{ inputs.localmath_revision }}
          path: ecosystem/LocalMath
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/CorePotts.jl
          ref: ${{ inputs.corepotts_revision }}
          path: ecosystem/CorePotts
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: PraneethMerugu/Potts.jl
          ref: ${{ inputs.potts_revision }}
          path: ecosystem/Potts
      - name: Show tested source revisions
        run: |
          for package in LocalMath CorePotts Potts; do
            printf '%s ' "$package"
            git -C "ecosystem/$package" rev-parse HEAD
          done
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: LocalMath Metal tests
        run: julia --project=ecosystem/LocalMath/test/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="ecosystem/LocalMath"); Pkg.instantiate(); include("ecosystem/LocalMath/test/metal/runtests.jl")'
      - name: CorePotts Metal tests
        run: julia --project=ecosystem/CorePotts/test/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts")]); Pkg.instantiate(); include("ecosystem/CorePotts/test/metal/runtests.jl")'
      - name: Potts Metal tests
        run: julia --project=ecosystem/Potts/benchmark/backends/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts")]); Pkg.instantiate(; julia_version_strict=true); include("ecosystem/Potts/benchmark/backends/metal/runtests.jl")'
      # Selected siblings replace profile pins for this candidate experiment only.
      # The separate CI exact-replay job retains the published closed environment.
      - name: Native continuation at selected commits
        run: julia --project=ecosystem/Potts/integration/replay --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("ecosystem/LocalMath", "ecosystem/CorePotts", "ecosystem/Potts")]); Pkg.instantiate(; julia_version_strict=true); include("ecosystem/Potts/integration/replay/runtests.jl")'
