# Declarative test groups for LatticeFields.
# Julia reads `in_all`, `group`, and `tags`; the remaining keys are CI metadata.

[exec]
group = "exec"
in_all = true
tags = ["exec"]
versions = ["1.12", "1.13"]
os = ["self-hosted"]
runner = ["self-hosted", "Linux", "X64"]
num_threads = 1
timeout = 30

