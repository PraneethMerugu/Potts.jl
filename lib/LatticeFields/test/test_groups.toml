# Test groups of LatticeFields (lib/LatticeFields/test/runtests.jl). The schema is in
# test/README.md.

# GROUP=All: these groups
all = ["exec", "ir", "compile", "schedule", "problems", "solvers", "qa"]
# 3 workers fit the 24G memory scope; each gets this process's thread count
workers = 3
testitem_timeout = 3600
logs = "batched"

[exec]
tags = ["exec"]

[ir]
tags = ["ir"]

[compile]
tags = ["compile"]

[schedule]
tags = ["schedule"]

[problems]
tags = ["problems"]

[solvers]
tags = ["solvers"]

[qa]
tags = ["qa"]

# the solver iteration budget sweep over sizes (about 10 minutes)
[solvers_gate]
tags = ["solvers_gate"]

[gpu]
tags = ["gpu_only"]
device = true
