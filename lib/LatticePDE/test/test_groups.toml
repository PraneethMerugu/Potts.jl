# Test groups of LatticePDE (lib/LatticePDE/test/runtests.jl). The schema is in
# test/README.md.

# GROUP=All: these groups
all = ["core", "qa"]
# 3 workers fit the 24G memory scope; each gets this process's thread count
workers = 3
testitem_timeout = 3600
logs = "batched"

[core]
tags = ["latticepde"]
exclude_tags = ["qa"]

[qa]
tags = ["qa"]

[gpu]
tags = ["gpu_only"]
device = true
