# Declarative test groups for MakiePotts.
# Julia reads `in_all`, `group`, and `tags`; the remaining keys are CI metadata.

[core]
group = "core"
in_all = true
tags = ["core"]
versions = ["1.12", "1.13"]
os = ["self-hosted"]
runner = ["self-hosted", "Linux", "X64"]
num_threads = 1
timeout = 30

