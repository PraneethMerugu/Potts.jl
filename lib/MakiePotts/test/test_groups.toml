# Test groups of MakiePotts (lib/MakiePotts/test/runtests.jl). The schema is in
# test/README.md.

# GROUP=All: these groups
all = [
    "core", "qa", "acceptance", "adversarial", "allocations", "downstream_conformance",
    "saved_state_channels", "visual",
]
# each worker gets this process's thread count
workers = 2
testitem_timeout = 3600
logs = "batched"

[core]
tags = ["core"]

[qa]
tags = ["qa"]

[acceptance]
tags = ["acceptance"]

[adversarial]
tags = ["adversarial"]

[allocations]
tags = ["allocations"]

[downstream_conformance]
tags = ["downstream_conformance"]

[saved_state_channels]
tags = ["saved_state_channels"]

[visual]
tags = ["visual"]
