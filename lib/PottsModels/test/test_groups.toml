# Test groups of PottsModels (lib/PottsModels/test/runtests.jl). The schema is in
# test/README.md. A group picks files: `dirs` (every file under these directories), `files`
# (these files) and `exclude_files`; a group that names neither `dirs` nor `files` takes
# every file.

# GROUP=All: these groups
all = ["core", "qa"]
# the items run in this process, which has the threads of the run (CI: julia -t 4 per shard)
workers = 0
testitem_timeout = 7200
logs = "batched"

# every file but the QA file
[core]
exclude_files = ["qa_tests.jl"]

[qa]
files = ["qa_tests.jl"]

[acceptance]
dirs = ["acceptance"]

[reproductions]
dirs = ["reproductions"]

[guardrails]
files = ["guardrails_tests.jl"]

# the acceptance files' device testsets on the device
[gpu]
dirs = ["acceptance"]
device = true
