name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: corepotts-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_VERSION: '1.12.6'
  LOCALMATH_REF: 'v0.2.0-rc1'

jobs:
  package:
    name: Package tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2"])'

  macos-smoke:
    name: Package smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Package smoke tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.develop(path="deps/LocalMath"); Pkg.instantiate(); Pkg.test(; test_args=["--jobs=2", "inventory", "api_boundary", "rng_contract", "scientific_reference"])'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Build documentation
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate(); include("docs/make.jl")'

  metal:
    name: Metal qualification
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: PraneethMerugu/LocalMath.jl
          ref: '${{ env.LOCALMATH_REF }}'
          path: deps/LocalMath
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Metal qualification
        run: julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.develop([PackageSpec(path=path) for path in ("deps/LocalMath", ".")]); Pkg.instantiate(); include("test/metal/runtests.jl")'
