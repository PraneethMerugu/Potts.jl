# Test groups of CorePotts (lib/CorePotts/test/runtests.jl). The schema is in test/README.md.

# GROUP=All: these groups
all = ["core", "qa"]
# 3 workers fit the 24G memory scope; each gets this process's thread count
workers = 3
testitem_timeout = 3600
logs = "batched"

[core]
tags = ["corepotts"]
exclude_tags = ["qa"]

[qa]
tags = ["qa"]

# the items that name a device, then the scan of the compiled kernels (`:device_scan`)
[gpu]
tags = ["device", "device_scan"]
device = true
