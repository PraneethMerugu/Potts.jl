name: CI

on: [push, pull_request, workflow_dispatch]

env:
  JULIA_VERSION: '1.12.6'

jobs:
  cpu:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Package tests
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Scientific witnesses
        run: julia --project=test/scientific_witnesses --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("test/scientific_witnesses/runtests.jl")'
      - name: Documentation
        run: julia --project=docs --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("docs/make.jl")'

  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with: {version: '${{ env.JULIA_VERSION }}'}
      - uses: julia-actions/cache@v3
      - name: Metal qualification
        run: julia --project=test/metal --startup-file=no -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate(); include("test/metal/runtests.jl")'
