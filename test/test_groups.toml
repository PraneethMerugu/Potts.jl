# Test groups of the monorepo root (test/runtests.jl). The schema is in test/README.md.

# GROUP=All: these groups, in this order
all = ["LatticeFields", "LatticePDE", "CorePotts", "MakiePotts", "Potts", "PottsModels"]
# Workers share the 24G memory scope of the run: 4 workers of one thread each; a worker
# restarts after an item when the scope is above 80 % of its limit; an item that runs longer
# than 20 min fails.
workers = 4
worker_threads = 1
memory_threshold = 0.8
testitem_timeout = 1200

# Each package's own suite, in its own test environment (lib/<Package>/test)
[LatticeFields]
package = "LatticeFields"

[LatticePDE]
package = "LatticePDE"

[CorePotts]
package = "CorePotts"

[MakiePotts]
package = "MakiePotts"

[PottsModels]
package = "PottsModels"

# The Potts suite (test/*_tests.jl)
[Potts]
tags = ["potts"]

[Potts_core]
tags = ["potts"]
exclude_tags = [
    "qa",
    "field_vocabulary", "fields", "fields_boundary", "fields_coarse", "fields_components",
    "fields_couple", "fields_couple_checks", "fields_couple_bindings", "fields_couple_names", "fields_couple_arrays_faces",
    "fields_couple_inputs", "fields_implicit", "fields_jiang", "fields_report", "fields_short",
    "fields_steppers",
    "adaptive", "algebraic", "draws_folds", "edge_updates", "initialization", "kind_classes",
    "mtk_native", "solvers", "sweep_spec", "symbolic", "units", "system_container",
]

[Potts_fields]
tags = [
    "field_vocabulary", "fields", "fields_boundary", "fields_coarse", "fields_components",
    "fields_couple", "fields_couple_checks", "fields_couple_bindings", "fields_couple_names", "fields_couple_arrays_faces",
    "fields_couple_inputs", "fields_implicit", "fields_jiang", "fields_report", "fields_short",
    "fields_steppers",
]
exclude_tags = ["qa"]

[Potts_symbolic]
tags = [
    "adaptive", "algebraic", "draws_folds", "edge_updates", "initialization", "kind_classes",
    "mtk_native", "solvers", "sweep_spec", "symbolic", "units", "system_container",
]
exclude_tags = ["qa"]

[Potts_qa]
tags = ["qa"]

# The Potts part of GROUP=GPU: the items that name a device and the device files' items
[Potts_gpu]
tags = ["device", "gpu"]
exclude_tags = ["qa"]
device = true

# The items that need four threads, in this process (julia -t 4)
[Multithreaded]
tags = ["multithreaded"]
exclude_tags = ["qa", "gpu_only"]
workers = 0
min_threads = 4

# The device tests of every package on one device (POTTS_GPU, else the platform's), without
# the QA items; on ROCm, then the check that every CorePotts kernel was scanned
[GPU]
groups = ["LatticeFields_gpu", "LatticePDE_gpu", "CorePotts_gpu", "Potts_gpu"]
device = true
qa = false
rocm_check = "device_coverage.jl"
