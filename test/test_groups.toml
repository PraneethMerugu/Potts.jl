# Declarative test groups for the Potts monorepo root (test/runtests.jl).
# Julia reads `in_all`, `group`, and routing fields (`sublib`, `tags`, `exclude_tags`).
# `versions`, `os`, `runner`, `num_threads`, and `timeout` are CI workflow metadata.

[LatticeFields]
group = "LatticeFields"
sublib = "LatticeFields"
in_all = true
versions = ["1.12", "1.13"]
os = ["self-hosted"]
runner = ["self-hosted", "Linux", "X64"]
num_threads = 1
timeout = 60

