# Potts root-package sub-groups (selected via GROUP=Potts_<group>; already included in [Potts]).

[Potts_core]
group = "Potts_core"
in_all = false
tags = ["potts"]
exclude_tags = [
    "qa", "gpu", "gpu_only",
    "field_vocabulary", "fields", "fields_boundary", "fields_coarse", "fields_components",
    "fields_couple", "fields_couple_b6", "fields_couple_e", "fields_couple_e8", "fields_couple_e11",
    "fields_couple_w2", "fields_implicit", "fields_jiang", "fields_report", "fields_short",
    "fields_steppers",
    "adaptive", "algebraic", "draws_folds", "edge_updates", "initialization", "kind_classes",
    "mtk_native", "solvers", "sweep_spec", "symbolic", "units", "wlite",
]
versions = ["1.12", "1.13"]
os = ["self-hosted"]
runner = ["self-hosted", "Linux", "X64"]
num_threads = 1
timeout = 60

